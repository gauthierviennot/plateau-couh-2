<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Plateau Hexagonal</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f0f0f0;
    }

    /* Modale de confirmation */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .modal-content p {
      color: #d9534f;
      font-weight: bold;
    }

    .modal-buttons {
      margin-top: 15px;
      display: flex;
      justify-content: space-around;
    }

    /* Mode Plein Écran */
    .fullscreen {
      position: fixed !important;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #111;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #exit-fullscreen-btn {
      display: none;
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .fullscreen #exit-fullscreen-btn {
      display: block;
    }

    /* Palette sous forme d'hexagones de sélection */
    .color-selector {
      display: flex;
      gap: 15px;
      margin: 15px 0;
    }

    .color-hex {
      width: 40px;
      height: 46px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      cursor: pointer;
      transition: transform 0.2s, outline 0.2s;
    }

    .color-hex:hover {
      transform: scale(1.1);
    }

    .color-hex.selected {
      transform: scale(1.15);
      outline: 3px solid #333;
    }
  </style>
</head>
<body>

  <div id="controls">
    <label>Largeur : <input type="number" id="width-input" value="10" min="1"></label>
    <label>Hauteur : <input type="number" id="height-input" value="10" min="1"></label>
    <button id="apply-size-btn">Valider la taille</button>
    <button id="toggle-fullscreen-btn">Mode Plein Écran</button>

    <h3>Sélectionner une couleur :</h3>
    <div class="color-selector" id="color-selector">
      <div class="color-hex selected" style="background-color: #ff4757;" data-color="#ff4757"></div>
      <div class="color-hex" style="background-color: #2ed573;" data-color="#2ed573"></div>
      <div class="color-hex" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
      <div class="color-hex" style="background-color: #ffa502;" data-color="#ffa502"></div>
      <div class="color-hex" style="background-color: #9b59b6;" data-color="#9b59b6"></div>
    </div>
  </div>

  <div id="board-container">
    <button id="exit-fullscreen-btn">Quitter le plein écran</button>
    <svg id="board"></svg>
  </div>

  <!-- Avertissement de confirmation -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-content">
      <h3>Attention !</h3>
      <p>Toutes les données et modifications actuelles du plateau vont être définitivement perdues.</p>
      <p>Voulez-vous vraiment changer la taille ?</p>
      <div class="modal-buttons">
        <button id="confirm-reset-btn">Oui, réinitialiser</button>
        <button id="cancel-reset-btn">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    let selectedColor = "#ff4757";
    let pendingWidth = 10;
    let pendingHeight = 10;

    const boardContainer = document.getElementById('board-container');
    const applySizeBtn = document.getElementById('apply-size-btn');
    const confirmModal = document.getElementById('confirm-modal');
    const confirmResetBtn = document.getElementById('confirm-reset-btn');
    const cancelResetBtn = document.getElementById('cancel-reset-btn');
    const toggleFullscreenBtn = document.getElementById('toggle-fullscreen-btn');
    const exitFullscreenBtn = document.getElementById('exit-fullscreen-btn');

    // Gestion de la sélection de couleur via les hexagones
    document.querySelectorAll('.color-hex').forEach(hex => {
      hex.addEventListener('click', (e) => {
        document.querySelectorAll('.color-hex').forEach(h => h.classList.remove('selected'));
        e.target.classList.add('selected');
        selectedColor = e.target.getAttribute('data-color');
      });
    });

    // Demande de confirmation avant réinitialisation
    applySizeBtn.addEventListener('click', () => {
      pendingWidth = parseInt(document.getElementById('width-input').value, 10);
      pendingHeight = parseInt(document.getElementById('height-input').value, 10);
      confirmModal.style.display = 'flex';
    });

    confirmResetBtn.addEventListener('click', () => {
      confirmModal.style.display = 'none';
      initBoard(pendingWidth, pendingHeight);
    });

    cancelResetBtn.addEventListener('click', () => {
      confirmModal.style.display = 'none';
    });

    // Gestion du plein écran et bouton de sortie
    toggleFullscreenBtn.addEventListener('click', () => {
      boardContainer.classList.add('fullscreen');
    });

    exitFullscreenBtn.addEventListener('click', () => {
      boardContainer.classList.remove('fullscreen');
    });

    function initBoard(w, h) {
      // Logique d'initialisation du SVG du plateau à insérer ici
    }
  </script>
</body>
</html>
