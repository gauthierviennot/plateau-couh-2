<!DOCTYPE html>
<html lang="fr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plateau Hexagonal Collaboratif</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        body { display: flex; height: 100vh; background-color: #f0f2f5; color: #333; overflow: hidden; }
        #sidebar { width: 300px; background: #ffffff; padding: 15px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; z-index: 10; }
        h1 { font-size: 1.1rem; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        h2 { font-size: 0.95rem; color: #34495e; margin-top: 5px; }
        
        .login-box { display: flex; flex-direction: column; gap: 8px; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .user-list { font-size: 0.8rem; background: #eef2f7; padding: 8px; border-radius: 4px; color: #34495e; max-height: 100px; overflow-y: auto; }
        .user-item { padding: 2px 0; display: flex; align-items: center; gap: 5px; }
        .user-item::before { content: "•"; color: #2ecc71; font-weight: bold; }
        
        .status { font-size: 0.8rem; padding: 6px; border-radius: 4px; text-align: center; font-weight: bold; background: #e8f8f5; color: #27ae60; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; font-size: 0.8rem; color: #555; }
        input[type="text"], input[type="number"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 100%; font-size: 0.85rem; }
        
        /* Palette à 12 terrains */
        .terrain-palette { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        .terrain-item { display: flex; align-items: center; gap: 6px; background: #fff; padding: 4px; border: 1px solid #ddd; border-radius: 4px; }
        .terrain-color-input { width: 30px; height: 30px; border: none; cursor: pointer; border-radius: 3px; background: none; }
        .terrain-color-input:disabled { cursor: not-allowed; opacity: 0.8; }
        .terrain-label-input { flex: 1; padding: 4px; border: 1px solid transparent; background: transparent; font-size: 0.8rem; }
        .terrain-label-input:enabled { border: 1px solid #ccc; background: #fff; }
        .btn-select-terrain { padding: 4px 8px; border: none; background: #3498db; color: white; border-radius: 3px; cursor: pointer; font-size: 0.75rem; }

        .btn { padding: 8px; border: none; border-radius: 4px; background-color: #3498db; color: white; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .btn-go { background-color: #2ecc71; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .btn-config { background-color: #34495e; }
        .btn-danger { background-color: #e74c3c; }
        
        #main { flex: 1; position: relative; background-color: #e5e9f0; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .mode-toggle-container { position: absolute; top: 15px; right: 15px; z-index: 20; }
        .btn-mode { padding: 10px 16px; border: none; border-radius: 20px; font-weight: bold; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background-color 0.2s, transform 0.1s; }
        .btn-mode.paint { background-color: #2ecc71; color: white; }
        .btn-mode.move { background-color: #3498db; color: white; }
        .btn-mode:active { transform: scale(0.95); }
        canvas { background-color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 8px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.hidden { display: none; }
        .modal-content { background: #ffffff; padding: 20px; border-radius: 8px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 15px; }
        .modal-content h2 { font-size: 1.1rem; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        .btn-secondary { background-color: #95a5a6; }
        .alert-warning { background-color: #fce4e4; border: 1px solid #f5c6cb; color: #721c24; padding: 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; line-height: 1.3; }

        .fullscreen-palette {
            position: absolute; top: 70px; left: 15px; z-index: 30;
            display: none; flex-direction: column; gap: 6px;
            background: rgba(255, 255, 255, 0.85); padding: 10px;
            border-radius: 12px; backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto;
        }
        :fullscreen .fullscreen-palette, :-webkit-full-screen .fullscreen-palette { display: flex; }

        .hex-option {
            width: 32px; height: 32px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            cursor: pointer; border: none; flex-shrink: 0;
            transition: transform 0.2s ease, filter 0.2s;
        }
        .hex-option:hover { transform: scale(1.15); }
        .hex-option.selected { transform: scale(1.2); filter: drop-shadow(0px 0px 4px #000); }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>Plateau Collaboratif</h1>
        <div id="status" class="status">En ligne</div>

        <!-- Section Connexion intégrée -->
        <div class="login-box">
            <label for="usernameInput">Pseudo :</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="usernameInput" placeholder="Ton pseudo" maxlength="15">
                <button class="btn" id="btnSetUsername">OK</button>
            </div>
        </div>

        <!-- Liste des utilisateurs connectés -->
        <h2>Joueurs en ligne</h2>
        <div id="onlineUsers" class="user-list">
            <div class="user-item">Anonyme</div>
        </div>

        <button class="btn btn-config" id="btnOpenModal">⚙️ Régler le plateau</button>

        <!-- Liste des 12 Terrains -->
        <h2>Terrains & Couleurs</h2>
        <div class="terrain-palette" id="terrainContainer">
            <!-- Injecté dynamiquement par JavaScript -->
        </div>

        <button class="btn btn-go" id="btnGo">🚀 GO !</button>
        <button class="btn btn-danger" id="btnClear">Effacer Tout</button>
    </div>

    <div id="main">
        <div class="fullscreen-palette" id="fsPalette">
            <!-- Les options hexagones en plein écran seront générées ici -->
        </div>

        <div class="mode-toggle-container">
            <button id="btnModeToggle" class="btn-mode paint">Mode : Peindre 🎨</button>
        </div>
        <canvas id="hexCanvas"></canvas>
    </div>

    <!-- Modale Avertissement Réécriture -->
    <div id="overrideModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Modification d'une case</h2>
            <p id="overrideMessage" style="font-size: 0.9rem; line-height: 1.4; color: #2c3e50;"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btnCancelOverride">Annuler</button>
                <button class="btn btn-danger" id="btnConfirmOverride">Confirmer le changement</button>
            </div>
        </div>
    </div>

    <!-- Modale Configuration Dimensions -->
    <div id="configModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Dimensions du Plateau</h2>
            <div class="control-group">
                <label for="cols">Nombre de plaques en largeur (Colonnes)</label>
                <input type="number" id="cols" value="10" min="2" max="50">
            </div>
            <div class="control-group">
                <label for="rows">Nombre de plaques en longueur (Lignes)</label>
                <input type="number" id="rows" value="8" min="2" max="50">
            </div>
            <div class="alert-warning">
                ⚠️ Attention : Modifier la taille du plateau effacera toutes les données actuelles !
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btnCloseModal">Annuler</button>
                <button class="btn btn-danger" id="btnApplyConfig">Confirmer et appliquer</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');

        let myUsername = "Anonyme";
        let activeColor = "#2ecc71";
        let pendingTileKey = null;

        let scale = 1.0, panX = 0, panY = 0;
        let cols = 10, rows = 8, hexRadius = 35;
        let gridData = {};

        let isPaintMode = true;
        let isMouseDown = false;
        let startX = 0, startY = 0;

        let initialPinchDistance = null;
        let initialScale = 1.0;
        let initialPanX = 0, initialPanY = 0;
        let pinchCenter = { x: 0, y: 0 };

        // Configuration par défaut des 12 terrains
        let terrains = [
            { color: '#2ecc71', label: 'Plaine' },
            { color: '#27ae60', label: 'Forêt' },
            { color: '#3498db', label: 'Eau' },
            { color: '#f1c40f', label: 'Désert' },
            { color: '#95a5a6', label: 'Montagne' },
            { color: '#ffffff', label: 'Gomme' },
            { color: '#e74c3c', label: 'Lave' },
            { color: '#8e44ad', label: 'Marais' },
            { color: '#e67e22', label: 'Canyon' },
            { color: '#16a085', label: 'Jungle' },
            { color: '#34495e', label: 'Rocher' },
            { color: '#d35400', label: 'Terre' }
        ];

        const usernameInput = document.getElementById('usernameInput');
        const btnSetUsername = document.getElementById('btnSetUsername');
        const onlineUsers = document.getElementById('onlineUsers');
        
        const inputCols = document.getElementById('cols');
        const inputRows = document.getElementById('rows');
        const btnModeToggle = document.getElementById('btnModeToggle');
        
        const overrideModal = document.getElementById('overrideModal');
        const overrideMessage = document.getElementById('overrideMessage');
        const btnCancelOverride = document.getElementById('btnCancelOverride');
        const btnConfirmOverride = document.getElementById('btnConfirmOverride');

        const configModal = document.getElementById('configModal');
        const btnOpenModal = document.getElementById('btnOpenModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnApplyConfig = document.getElementById('btnApplyConfig');
        
        const terrainContainer = document.getElementById('terrainContainer');
        const fsPalette = document.getElementById('fsPalette');

        // Gestion du Pseudo
        function updateUsername() {
            const val = usernameInput.value.trim();
            if (val.length > 0) {
                myUsername = val;
                socket.emit('set-username', myUsername);
                renderTerrains();
            }
        }

        btnSetUsername.addEventListener('click', updateUsername);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') updateUsername();
        });

        // Mise à jour de la liste des utilisateurs reçue du serveur
        socket.on('update-users-list', (users) => {
            onlineUsers.innerHTML = '';
            users.forEach(u => {
                const item = document.createElement('div');
                item.className = 'user-item';
                item.textContent = u;
                onlineUsers.appendChild(item);
            });
        });

        // Rendu de la palette de 12 Terrains
        function renderTerrains() {
            const isAdmin = myUsername.toLowerCase() === 'admin';
            terrainContainer.innerHTML = '';
            fsPalette.innerHTML = '';

            terrains.forEach((t, idx) => {
                // Élément du volet latéral
                const item = document.createElement('div');
                item.className = 'terrain-item';
                
                const colorInput = document.createElement('input');
                colorInput.type = 'color';
                colorInput.className = 'terrain-color-input';
                colorInput.value = t.color;
                colorInput.disabled = !isAdmin;
                colorInput.addEventListener('change', (e) => {
                    terrains[idx].color = e.target.value;
                    socket.emit('update-terrains', terrains);
                });

                const labelInput = document.createElement('input');
                labelInput.type = 'text';
                labelInput.className = 'terrain-label-input';
                labelInput.value = t.label;
                labelInput.disabled = !isAdmin;
                labelInput.addEventListener('change', (e) => {
                    terrains[idx].label = e.target.value;
                    socket.emit('update-terrains', terrains);
                });

                const selectBtn = document.createElement('button');
                selectBtn.className = 'btn-select-terrain';
                selectBtn.textContent = 'Choisir';
                selectBtn.onclick = () => selectColor(t.color);

                item.appendChild(colorInput);
                item.appendChild(labelInput);
                item.appendChild(selectBtn);
                terrainContainer.appendChild(item);

                // Option pour le mode Plein Écran
                const hexBtn = document.createElement('button');
                hexBtn.className = 'hex-option' + (t.color === activeColor ? ' selected' : '');
                hexBtn.style.backgroundColor = t.color;
                hexBtn.onclick = () => selectColor(t.color);
                fsPalette.appendChild(hexBtn);
            });
        }

        function selectColor(color) {
            activeColor = color;
            setMode(true);
            renderTerrains();
        }

        socket.on('update-terrains', (newTerrains) => {
            terrains = newTerrains;
            renderTerrains();
        });

        // Bouton GO!
        document.getElementById('btnGo').addEventListener('click', () => {
            alert('Action GO lancée !');
        });

        btnOpenModal.addEventListener('click', () => {
            inputCols.value = cols;
            inputRows.value = rows;
            configModal.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => configModal.classList.add('hidden'));

        btnApplyConfig.addEventListener('click', () => {
            const newCols = parseInt(inputCols.value);
            const newRows = parseInt(inputRows.value);

            if (newCols !== cols || newRows !== rows) {
                if (confirm("Toutes les données du plateau vont être perdues. Voulez-vous continuer ?")) {
                    cols = newCols;
                    rows = newRows;
                    socket.emit('change-config', { cols, rows });
                    configModal.classList.add('hidden');
                }
            } else {
                configModal.classList.add('hidden');
            }
        });

        function setMode(paintMode) {
            isPaintMode = paintMode;
            if (isPaintMode) {
                btnModeToggle.textContent = "Mode : Peindre 🎨";
                btnModeToggle.className = "btn-mode paint";
            } else {
                btnModeToggle.textContent = "Mode : Déplacer / Zoomer ✋";
                btnModeToggle.className = "btn-mode move";
            }
        }

        btnModeToggle.addEventListener('click', () => setMode(!isPaintMode));

        socket.on('init', (data) => {
            gridData = data.gridData;
            cols = data.config.cols;
            rows = data.config.rows;
            if (data.terrains) terrains = data.terrains;
            inputCols.value = cols;
            inputRows.value = rows;
            renderTerrains();
            initCanvas();
        });

        socket.on('update-tile', (data) => {
            gridData[data.key] = { color: data.color, author: data.author };
            drawGrid();
        });

        socket.on('update-config', (data) => {
            cols = data.config.cols;
            rows = data.config.rows;
            gridData = data.gridData;
            inputCols.value = cols;
            inputRows.value = rows;
            initCanvas();
        });

        socket.on('clear-grid', () => {
            gridData = {};
            drawGrid();
        });

        function initCanvas() {
            const hexWidth = Math.sqrt(3) * hexRadius;
            const hexHeight = 2 * hexRadius;
            canvas.width = cols * hexWidth + (hexWidth / 2) + 20;
            canvas.height = rows * (hexHeight * 0.75) + (hexHeight * 0.25) + 20;
            drawGrid();
        }

        function getHexCenter(col, row) {
            const hexWidth = Math.sqrt(3) * hexRadius;
            const xOffset = (row % 2 === 1) ? hexWidth / 2 : 0;
            return {
                x: 10 + hexWidth / 2 + col * hexWidth + xOffset,
                y: 10 + hexRadius + row * (hexRadius * 1.5)
            };
        }

        function drawHexagon(x, y, radius, fillColor) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const pointX = x + radius * Math.cos(angle);
                const pointY = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(pointX, pointY);
                else ctx.lineTo(pointX, pointY);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor || '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawGrid() {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const { x, y } = getHexCenter(c, r);
                    const key = `${c},${r}`;
                    const tile = gridData[key];
                    const color = tile ? tile.color : '#ffffff';
                    drawHexagon(x, y, hexRadius, color);
                }
            }
            ctx.restore();
        }

        function paintTile(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const mouseX = (canvasX - panX) / scale;
            const mouseY = (canvasY - panY) / scale;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const { x, y } = getHexCenter(c, r);
                    if (Math.hypot(mouseX - x, mouseY - y) < hexRadius * 0.85) {
                        const key = `${c},${r}`;
                        const currentColor = activeColor;
                        const existingTile = gridData[key];

                        if (existingTile && existingTile.author && existingTile.author !== myUsername && existingTile.color !== currentColor) {
                            isMouseDown = false;
                            pendingTileKey = key;
                            overrideMessage.innerHTML = `L'utilisateur <strong>${existingTile.author}</strong> a déjà modifié cet hexagone.<br><br>Voulez-vous vraiment remplacer sa couleur ?`;
                            overrideModal.classList.remove('hidden');
                            return;
                        }

                        if (!existingTile || existingTile.color !== currentColor) {
                            gridData[key] = { color: currentColor, author: myUsername };
                            drawGrid();
                            socket.emit('paint-tile', { key, color: currentColor });
                        }
                        return;
                    }
                }
            }
        }

        btnConfirmOverride.addEventListener('click', () => {
            if (pendingTileKey) {
                const color = activeColor;
                gridData[pendingTileKey] = { color, author: myUsername };
                drawGrid();
                socket.emit('paint-tile', { key: pendingTileKey, color });
                pendingTileKey = null;
            }
            overrideModal.classList.add('hidden');
        });

        btnCancelOverride.addEventListener('click', () => {
            pendingTileKey = null;
            overrideModal.classList.add('hidden');
        });

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            if (isPaintMode) paintTile(e.clientX, e.clientY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            if (isPaintMode) {
                paintTile(e.clientX, e.clientY);
            } else {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                drawGrid();
            }
        });

        window.addEventListener('mouseup', () => isMouseDown = false);

        function getTouchDistance(t1, t2) {
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        }

        function getTouchCenter(t1, t2, rect) {
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: ((t1.clientX + t2.clientX) / 2 - rect.left) * scaleX,
                y: ((t1.clientY + t2.clientY) / 2 - rect.top) * scaleY
            };
        }

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            
            if (e.touches.length === 1) {
                isMouseDown = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
                if (isPaintMode) paintTile(e.touches[0].clientX, e.touches[0].clientY);
            } else if (e.touches.length === 2) {
                isMouseDown = false;
                initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
                initialScale = scale;
                initialPanX = panX;
                initialPanY = panY;
                pinchCenter = getTouchCenter(e.touches[0], e.touches[1], rect);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isMouseDown) {
                if (isPaintMode) {
                    paintTile(e.touches[0].clientX, e.touches[0].clientY);
                } else {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    drawGrid();
                }
            } else if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                const currentCenter = getTouchCenter(e.touches[0], e.touches[1], rect);

                const factor = currentDistance / initialPinchDistance;
                let newScale = Math.min(Math.max(initialScale * factor, 0.3), 4.0);

                const ratio = newScale / initialScale;
                panX = currentCenter.x - (pinchCenter.x - initialPanX) * ratio;
                panY = currentCenter.y - (pinchCenter.y - initialPanY) * ratio;

                scale = newScale;
                drawGrid();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
            if (e.touches.length === 0) isMouseDown = false;
        });

        document.getElementById('btnClear').addEventListener('click', () => socket.emit('clear-grid'));

        // Initialisation de la palette au démarrage
        renderTerrains();
    </script>
</body>
</html>
