<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plateau Hexagonal Collaboratif</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --dark: #2c3e50;
            --slate: #34495e;
            --blue: #3498db;
            --green: #2ecc71;
            --green-dark: #27ae60;
            --red: #e74c3c;
            --orange: #e67e22;
            --grey: #95a5a6;
            --muted: #7f8c8d;
            --border: #ddd;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
        input { user-select: text; -webkit-user-select: text; }
        [hidden] { display: none !important; }

        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #333; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

        .page { display: none; position: absolute; inset: 0; }
        .page.active { display: flex; }

        /* Boutons communs */
        .btn { padding: 10px 14px; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 0.9rem; }
        .btn-primary { background: var(--blue); }
        .btn-dark { background: var(--slate); }
        .btn-danger { background: var(--red); }
        .btn-secondary { background: var(--grey); }
        .btn-small { padding: 6px 10px; font-size: 0.8rem; }

        /* Page 1 : connexion */
        #pageLogin { background: var(--dark); justify-content: center; align-items: center; }
        .login-card { background: #fff; padding: 30px; border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.2); width: 90%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .login-card h1 { font-size: 1.4rem; color: var(--dark); }
        .login-card input { padding: 12px; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; text-align: center; width: 100%; }
        .login-card .btn { padding: 12px; font-size: 1rem; }
        .error { color: var(--red); font-size: 0.85rem; font-weight: 600; }

        /* Page 2 : tableau de bord */
        #pageDashboard { background: #e5e9f0; justify-content: center; align-items: center; padding: 16px; }
        .dashboard-card { background: #fff; padding: 20px; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,.1); width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; touch-action: pan-y; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 2px solid var(--blue); padding-bottom: 8px; }
        .dashboard-header h2 { font-size: 1.2rem; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .section-title { font-weight: bold; font-size: 0.85rem; color: var(--muted); margin-top: 5px; }

        .user-list { background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; max-height: 100px; overflow-y: auto; font-size: 0.85rem; }
        .user-item { padding: 3px 0; display: flex; align-items: center; gap: 6px; color: var(--dark); font-weight: 500; }
        .user-item::before { content: "•"; color: var(--green); font-weight: bold; }

        .terrain-palette { display: flex; flex-direction: column; gap: 6px; }
        .terrain-item { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 6px; border: 1px solid var(--border); border-radius: 6px; }
        .terrain-color-preview { width: 28px; height: 28px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); flex-shrink: 0; }
        .terrain-color-input { width: 32px; height: 32px; border: none; background: none; flex-shrink: 0; }
        .terrain-label-text { font-size: 0.9rem; font-weight: 600; color: var(--slate); }
        .terrain-label-input { flex: 1; min-width: 0; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }

        .map-save { display: flex; gap: 6px; }
        .map-save input { flex: 1; min-width: 0; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .map-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
        .map-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f8f9fa; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
        .map-info { min-width: 0; display: flex; flex-direction: column; }
        .map-name { font-size: 0.9rem; font-weight: 600; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .map-meta { font-size: 0.72rem; color: var(--muted); }
        .map-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .empty { font-size: 0.85rem; color: var(--muted); }

        .btn-go { position: sticky; bottom: 0; margin-top: auto; padding: 14px; border: none; border-radius: 8px; background: var(--green); color: #fff; font-weight: bold; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(46,204,113,.3); flex-shrink: 0; }
        .btn-go:hover { background: var(--green-dark); }

        /* Page 3 : carte */
        #pageMap { background: var(--dark); overflow: hidden; touch-action: none; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

        .btn-exit { position: absolute; top: 15px; left: 15px; z-index: 50; width: 42px; height: 42px; background: var(--red); color: #fff; border: none; border-radius: 50%; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
        .mini-user-list { position: absolute; top: 65px; left: 15px; z-index: 50; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); padding: 6px 10px; border-radius: 6px; color: #fff; font-size: 0.7rem; max-width: 140px; max-height: 90px; overflow-y: auto; pointer-events: none; }
        .mini-user-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .mini-user-item::before { content: "•"; color: var(--green); }

        .fullscreen-palette { position: absolute; top: 165px; left: 15px; z-index: 50; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.9); padding: 10px; border-radius: var(--radius); backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,.2); max-height: calc(100% - 260px); overflow-y: auto; touch-action: pan-y; }
        .hex-option { width: 34px; height: 34px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border: none; flex-shrink: 0; transition: transform .2s; }
        .hex-option.selected { transform: scale(1.25); filter: drop-shadow(0 0 5px #000); }

        .map-toolbar { position: absolute; top: 15px; right: 15px; z-index: 50; display: flex; gap: 8px; }
        .btn-pill { padding: 10px 16px; border: none; border-radius: 20px; font-weight: bold; font-size: 0.9rem; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
        .btn-pill.paint { background: var(--green); }
        .btn-pill.move { background: var(--blue); }
        .btn-pill.lock { background: var(--green); }
        .btn-pill.lock.locked { background: var(--red); }
        .btn-reset-view { width: 42px; height: 42px; border: none; border-radius: 50%; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; }

        .compass { position: absolute; bottom: 20px; right: 20px; z-index: 50; width: 80px; height: 80px; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); border-radius: 50%; box-shadow: 0 4px 12px rgba(0,0,0,.3); border: 2px solid var(--dark); }
        .compass-dial { width: 100%; height: 100%; position: relative; border-radius: 50%; }
        .compass-btn { position: absolute; font-weight: bold; font-size: 0.75rem; color: var(--dark); width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: rgba(255,255,255,.5); }
        .compass-btn:hover { background: var(--blue); color: #fff; }
        .compass-btn.n { top: 2px; left: 27px; color: var(--red); font-weight: 900; }
        .compass-btn.e { right: 2px; top: 27px; }
        .compass-btn.s { bottom: 2px; left: 27px; }
        .compass-btn.w { left: 2px; top: 27px; }
        .compass-needle { position: absolute; top: 50%; left: 50%; width: 4px; height: 36px; margin: -18px 0 0 -2px; pointer-events: none; }
        .compass-needle::before, .compass-needle::after { content: ''; position: absolute; left: 0; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
        .compass-needle::before { top: 0; border-bottom: 18px solid var(--red); }
        .compass-needle::after { bottom: 0; border-top: 18px solid var(--muted); }

        /* Fenêtres modales et notifications */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: min(320px, 92vw); box-shadow: 0 4px 20px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; }
        .modal-content p { font-size: 0.85rem; color: var(--dark); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.8rem; font-weight: 600; }
        .control-group input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }

        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; max-width: 90vw; padding: 10px 16px; border-radius: 8px; background: var(--dark); color: #fff; font-size: 0.85rem; box-shadow: 0 4px 12px rgba(0,0,0,.3); pointer-events: none; }
        .toast.error { background: var(--red); }
    </style>
</head>
<body>

    <!-- PAGE 1 : connexion -->
    <main id="pageLogin" class="page active">
        <div class="login-card">
            <h1>Plateau Hexagonal</h1>
            <input type="text" id="usernameInput" placeholder="Entrez votre pseudo" maxlength="15" autocomplete="off" autofocus>
            <input type="password" id="passwordInput" placeholder="Mot de passe administrateur" autocomplete="current-password" hidden>
            <p id="loginError" class="error" role="alert" hidden></p>
            <button id="btnLogin" class="btn btn-primary">Rejoindre</button>
        </div>
    </main>

    <!-- PAGE 2 : tableau de bord -->
    <main id="pageDashboard" class="page">
        <div class="dashboard-card">
            <div class="dashboard-header">
                <h2 id="welcomeUser">Bienvenue !</h2>
                <button id="btnAdminConfig" class="btn btn-dark admin-only" hidden>⚙️ Régler plateau</button>
            </div>

            <div class="section-title">Joueurs en ligne</div>
            <div id="onlineUsers" class="user-list"></div>

            <div class="section-title">Couleurs et légendes</div>
            <div id="terrainContainer" class="terrain-palette"></div>
            <button id="btnAddTerrain" class="btn btn-secondary admin-only" hidden>＋ Ajouter une couleur</button>

            <div class="section-title admin-only" hidden>Cartes enregistrées</div>
            <div class="map-save admin-only" hidden>
                <input type="text" id="mapNameInput" placeholder="Nom de la carte" maxlength="60" autocomplete="off">
                <button id="btnSaveMap" class="btn btn-primary">💾 Enregistrer</button>
            </div>
            <div id="mapList" class="map-list admin-only" hidden></div>

            <button id="btnGo" class="btn-go">🚀 GO !</button>
        </div>

        <div id="configModal" class="modal-overlay" hidden>
            <div class="modal-content">
                <h3>Taille du plateau</h3>
                <div class="control-group">
                    <label for="cols">Colonnes (largeur)</label>
                    <input type="number" id="cols" value="10" min="2" max="300">
                </div>
                <div class="control-group">
                    <label for="rows">Lignes (longueur)</label>
                    <input type="number" id="rows" value="8" min="2" max="300">
                </div>
                <p>Changer la taille vide le plateau. Une sauvegarde automatique est créée avant.</p>
                <div class="modal-actions">
                    <button id="btnCloseModal" class="btn btn-secondary">Annuler</button>
                    <button id="btnApplyConfig" class="btn btn-danger">Appliquer</button>
                </div>
            </div>
        </div>
    </main>

    <!-- PAGE 3 : carte -->
    <main id="pageMap" class="page">
        <button id="btnExitMap" class="btn-exit" title="Quitter la carte" aria-label="Quitter la carte">✖</button>
        <div id="miniOnlineUsers" class="mini-user-list"></div>
        <div id="fsPalette" class="fullscreen-palette"></div>

        <div class="map-toolbar">
            <button id="btnLockToggle" class="btn-pill lock admin-only" hidden>🔓 Déverrouillé</button>
            <button id="btnResetView" class="btn-reset-view" title="Centrer la carte" aria-label="Centrer la carte">🎯</button>
            <button id="btnModeToggle" class="btn-pill move">Mode : Déplacer ✋</button>
        </div>

        <div class="compass">
            <div id="compassDial" class="compass-dial">
                <div class="compass-needle"></div>
                <button class="compass-btn n" data-angle="0" aria-label="Nord en haut">N</button>
                <button class="compass-btn e" data-angle="270" aria-label="Est en haut">E</button>
                <button class="compass-btn s" data-angle="180" aria-label="Sud en haut">S</button>
                <button class="compass-btn w" data-angle="90" aria-label="Ouest en haut">O</button>
            </div>
        </div>

        <canvas id="hexCanvas"></canvas>

        <div id="overrideModal" class="modal-overlay" hidden>
            <div class="modal-content">
                <h3>Remplacer la case ?</h3>
                <p id="overrideMessage"></p>
                <div class="modal-actions">
                    <button id="btnCancelOverride" class="btn btn-secondary">Annuler</button>
                    <button id="btnConfirmOverride" class="btn btn-danger">Confirmer</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>

    <script>
    (() => {
        'use strict';

        /* ============================================================ */
        /* Constantes et état                                            */
        /* ============================================================ */

        const HEX_RADIUS = 35;
        const HEX_WIDTH = Math.sqrt(3) * HEX_RADIUS;
        const ROW_STEP = HEX_RADIUS * 1.5;
        const MIN_SCALE = 0.05;
        const MAX_SCALE = 5;
        const MIN_SIZE = 2;
        const MAX_SIZE = 300;
        const MAX_TERRAINS = 30;
        const EMPTY_COLOR = '#ffffff';
        const BACKGROUND = '#ecf0f1';
        const REQUEST_TIMEOUT_MS = 8000;

        const HEX_CORNERS = Array.from({ length: 6 }, (_, i) => {
            const angle = (Math.PI / 180) * (60 * i - 30);
            return [HEX_RADIUS * Math.cos(angle), HEX_RADIUS * Math.sin(angle)];
        });

        const $ = (id) => document.getElementById(id);
        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

        const socket = typeof io !== 'undefined' ? io() : null;

        const state = {
            username: '',
            password: '',
            isAdmin: false,
            isLocked: false,
            paintMode: false,
            activeColor: null,
            cols: 10,
            rows: 8,
            gridData: {},
            terrains: [],
            maps: []
        };

        const view = { scale: 1, panX: 0, panY: 0, rotation: 0 };
        let viewW = window.innerWidth;
        let viewH = window.innerHeight;
        let pendingTileKey = null;
        let wasFullscreen = false;

        const el = {
            pages: { login: $('pageLogin'), dashboard: $('pageDashboard'), map: $('pageMap') },
            username: $('usernameInput'),
            password: $('passwordInput'),
            loginError: $('loginError'),
            btnLogin: $('btnLogin'),
            welcome: $('welcomeUser'),
            onlineUsers: $('onlineUsers'),
            miniUsers: $('miniOnlineUsers'),
            terrainContainer: $('terrainContainer'),
            fsPalette: $('fsPalette'),
            mapName: $('mapNameInput'),
            mapList: $('mapList'),
            configModal: $('configModal'),
            overrideModal: $('overrideModal'),
            overrideMessage: $('overrideMessage'),
            btnLock: $('btnLockToggle'),
            btnMode: $('btnModeToggle'),
            compass: $('compassDial'),
            canvas: $('hexCanvas'),
            toast: $('toast')
        };
        const ctx = el.canvas.getContext('2d');

        const clientId = (() => {
            const fresh = () => (window.crypto?.randomUUID?.() ?? `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`);
            try {
                let id = localStorage.getItem('hexClientId');
                if (!id) {
                    id = fresh();
                    localStorage.setItem('hexClientId', id);
                }
                return id;
            } catch {
                return fresh();
            }
        })();

        /* ============================================================ */
        /* Utilitaires d'interface                                       */
        /* ============================================================ */

        function showPage(name) {
            for (const [key, page] of Object.entries(el.pages)) {
                page.classList.toggle('active', key === name);
            }
        }

        const isMapActive = () => el.pages.map.classList.contains('active');

        let toastTimer = null;
        function toast(message, isError = false) {
            el.toast.textContent = message;
            el.toast.classList.toggle('error', isError);
            el.toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.toast.hidden = true; }, 3200);
        }

        function request(event, payload) {
            return new Promise((resolve) => {
                if (!socket) return resolve({ success: false, message: 'Serveur injoignable.' });
                socket.timeout(REQUEST_TIMEOUT_MS).emit(event, payload, (err, res) => {
                    resolve(err || !res ? { success: false, message: 'Le serveur ne répond pas.' } : res);
                });
            });
        }

        function showLoginError(message) {
            el.loginError.textContent = message || '';
            el.loginError.hidden = !message;
        }

        function applyRole() {
            document.querySelectorAll('.admin-only').forEach((node) => { node.hidden = !state.isAdmin; });
        }

        function updateUsers(users) {
            el.onlineUsers.replaceChildren();
            el.miniUsers.replaceChildren();
            for (const name of users) {
                const item = document.createElement('div');
                item.className = 'user-item';
                item.textContent = name;
                el.onlineUsers.appendChild(item);

                const mini = document.createElement('div');
                mini.className = 'mini-user-item';
                mini.textContent = name;
                el.miniUsers.appendChild(mini);
            }
        }

        /* ============================================================ */
        /* Connexion                                                     */
        /* ============================================================ */

        el.username.addEventListener('input', () => {
            el.password.hidden = el.username.value.trim().toLowerCase() !== 'admin';
        });

        async function authenticate(name, password, isReconnect) {
            const res = await request('set-username', { name, password, clientId });

            if (!res.success) {
                state.username = '';
                state.password = '';
                showLoginError(res.message);
                showPage('login');
                return;
            }

            state.username = res.name;
            state.isAdmin = Boolean(res.isAdmin);
            state.password = state.isAdmin ? password : '';
            el.welcome.textContent = `Joueur : ${state.username}`;
            showLoginError('');
            applyRole();
            renderTerrains();
            if (!isReconnect) showPage('dashboard');
        }

        function handleLogin() {
            const name = el.username.value.trim();
            if (!name) return;
            if (!socket) return showLoginError('Connexion au serveur impossible.');
            authenticate(name, el.password.value, false);
        }

        el.btnLogin.addEventListener('click', handleLogin);
        [el.username, el.password].forEach((input) => {
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        });

        /* ============================================================ */
        /* Terrains (légende et palette)                                 */
        /* ============================================================ */

        const pushTerrains = () => socket?.emit('update-terrains', state.terrains);

        function buildReadonlyTerrain(terrain) {
            const item = document.createElement('div');
            item.className = 'terrain-item';

            const preview = document.createElement('div');
            preview.className = 'terrain-color-preview';
            preview.style.backgroundColor = terrain.color;

            const label = document.createElement('span');
            label.className = 'terrain-label-text';
            label.textContent = terrain.label;

            item.append(preview, label);
            return item;
        }

        function buildEditableTerrain(terrain, index) {
            const item = document.createElement('div');
            item.className = 'terrain-item';

            const colorInput = document.createElement('input');
            colorInput.type = 'color';
            colorInput.className = 'terrain-color-input';
            colorInput.value = terrain.color;
            colorInput.setAttribute('aria-label', `Couleur de ${terrain.label}`);
            colorInput.addEventListener('change', () => {
                if (state.activeColor === terrain.color) state.activeColor = colorInput.value;
                terrain.color = colorInput.value;
                pushTerrains();
            });

            const labelInput = document.createElement('input');
            labelInput.type = 'text';
            labelInput.className = 'terrain-label-input';
            labelInput.value = terrain.label;
            labelInput.maxLength = 40;
            labelInput.addEventListener('change', () => {
                terrain.label = labelInput.value.trim();
                pushTerrains();
            });

            const remove = document.createElement('button');
            remove.className = 'btn btn-danger btn-small';
            remove.textContent = '✕';
            remove.setAttribute('aria-label', `Supprimer ${terrain.label}`);
            remove.addEventListener('click', () => {
                if (state.terrains.length <= 1) return toast('Il faut garder au moins une couleur.', true);
                state.terrains.splice(index, 1);
                pushTerrains();
                renderTerrains();
            });

            item.append(colorInput, labelInput, remove);
            return item;
        }

        function buildPaletteButton(terrain) {
            const button = document.createElement('button');
            button.className = 'hex-option';
            button.style.backgroundColor = terrain.color;
            button.dataset.color = terrain.color;
            button.title = terrain.label;
            button.setAttribute('aria-label', terrain.label);
            button.addEventListener('click', () => {
                state.activeColor = terrain.color;
                markSelectedColor();
            });
            return button;
        }

        function markSelectedColor() {
            for (const button of el.fsPalette.children) {
                button.classList.toggle('selected', button.dataset.color === state.activeColor);
            }
        }

        function renderTerrains() {
            el.terrainContainer.replaceChildren();
            el.fsPalette.replaceChildren();

            if (!state.terrains.some((t) => t.color === state.activeColor)) {
                state.activeColor = state.terrains[0]?.color ?? null;
            }

            state.terrains.forEach((terrain, index) => {
                el.terrainContainer.appendChild(
                    state.isAdmin ? buildEditableTerrain(terrain, index) : buildReadonlyTerrain(terrain)
                );
                el.fsPalette.appendChild(buildPaletteButton(terrain));
            });
            markSelectedColor();
        }

        $('btnAddTerrain').addEventListener('click', () => {
            if (state.terrains.length >= MAX_TERRAINS) return toast(`Maximum ${MAX_TERRAINS} couleurs.`, true);
            state.terrains.push({ color: '#cccccc', label: 'Nouveau terrain' });
            pushTerrains();
            renderTerrains();
        });

        /* ============================================================ */
        /* Cartes enregistrées (admin)                                   */
        /* ============================================================ */

        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
        }

        function actionButton(text, className, label, handler) {
            const button = document.createElement('button');
            button.className = `btn btn-small ${className}`;
            button.textContent = text;
            button.setAttribute('aria-label', label);
            button.addEventListener('click', handler);
            return button;
        }

        async function runMapAction(event, payload) {
            const res = await request(event, payload);
            toast(res.message, !res.success);
            return res;
        }

        function renderMaps() {
            el.mapList.replaceChildren();

            if (state.maps.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'empty';
                empty.textContent = 'Aucune carte enregistrée pour le moment.';
                el.mapList.appendChild(empty);
                return;
            }

            for (const map of state.maps) {
                const item = document.createElement('div');
                item.className = 'map-item';

                const info = document.createElement('div');
                info.className = 'map-info';
                const name = document.createElement('span');
                name.className = 'map-name';
                name.textContent = map.name;
                const meta = document.createElement('span');
                meta.className = 'map-meta';
                meta.textContent = `${map.cols}×${map.rows}, ${map.tiles} cases, ${formatDate(map.savedAt)}${map.author ? `, par ${map.author}` : ''}`;
                info.append(name, meta);

                const actions = document.createElement('div');
                actions.className = 'map-actions';
                actions.append(
                    actionButton('Charger', 'btn-primary', `Charger ${map.name}`, () => {
                        if (confirm(`Charger « ${map.name} » ? Le plateau actuel sera remplacé pour tous les joueurs (une sauvegarde automatique est créée).`)) {
                            runMapAction('load-map', { id: map.id });
                        }
                    }),
                    actionButton('✏️', 'btn-dark', `Renommer ${map.name}`, () => {
                        const newName = prompt('Nouveau nom de la carte :', map.name);
                        if (newName !== null) runMapAction('rename-map', { id: map.id, name: newName });
                    }),
                    actionButton('🗑️', 'btn-danger', `Supprimer ${map.name}`, () => {
                        if (confirm(`Supprimer définitivement « ${map.name} » ?`)) {
                            runMapAction('delete-map', { id: map.id });
                        }
                    })
                );

                item.append(info, actions);
                el.mapList.appendChild(item);
            }
        }

        async function saveCurrentMap() {
            const name = el.mapName.value.trim();
            if (!name) return toast('Donnez un nom à la carte.', true);

            let res = await request('save-map', { name });
            if (res.code === 'exists') {
                if (!confirm(`Une carte « ${name} » existe déjà. La remplacer ?`)) return;
                res = await request('save-map', { name, id: res.id });
            }
            toast(res.message, !res.success);
            if (res.success) el.mapName.value = '';
        }

        $('btnSaveMap').addEventListener('click', saveCurrentMap);
        el.mapName.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveCurrentMap(); });

        /* ============================================================ */
        /* Configuration de la taille (admin)                            */
        /* ============================================================ */

        $('btnAdminConfig').addEventListener('click', () => {
            $('cols').value = state.cols;
            $('rows').value = state.rows;
            el.configModal.hidden = false;
        });
        $('btnCloseModal').addEventListener('click', () => { el.configModal.hidden = true; });

        $('btnApplyConfig').addEventListener('click', async () => {
            const cols = Number.parseInt($('cols').value, 10);
            const rows = Number.parseInt($('rows').value, 10);
            const valid = (n) => Number.isInteger(n) && n >= MIN_SIZE && n <= MAX_SIZE;

            if (!valid(cols) || !valid(rows)) {
                return toast(`La taille doit être comprise entre ${MIN_SIZE} et ${MAX_SIZE}.`, true);
            }
            if (!confirm('Changer la taille réinitialisera le plateau. Continuer ?')) return;

            const res = await request('change-config', { cols, rows });
            toast(res.message, !res.success);
            if (res.success) el.configModal.hidden = true;
        });

        /* ============================================================ */
        /* Verrouillage et mode peinture                                 */
        /* ============================================================ */

        function setPaintMode(on) {
            state.paintMode = on && !state.isLocked;
            el.btnMode.textContent = state.paintMode ? 'Mode : Peindre 🎨' : 'Mode : Déplacer ✋';
            el.btnMode.className = `btn-pill ${state.paintMode ? 'paint' : 'move'}`;
        }

        function updateLockUI() {
            el.btnLock.textContent = state.isLocked ? '🔒 Verrouillé' : '🔓 Déverrouillé';
            el.btnLock.classList.toggle('locked', state.isLocked);
            el.fsPalette.hidden = state.isLocked;
            el.btnMode.hidden = state.isLocked;
            if (state.isLocked) setPaintMode(false);
        }

        el.btnMode.addEventListener('click', () => setPaintMode(!state.paintMode));
        el.btnLock.addEventListener('click', () => socket?.emit('toggle-lock', !state.isLocked));

        /* ============================================================ */
        /* Plein écran et navigation                                     */
        /* ============================================================ */

        $('btnGo').addEventListener('click', () => {
            const root = document.documentElement;
            const enter = root.requestFullscreen || root.webkitRequestFullscreen;
            if (enter) {
                try {
                    const result = enter.call(root);
                    if (result?.catch) result.catch(() => {});
                } catch { /* plein écran indisponible : on continue sans */ }
            }

            showPage('map');
            setPaintMode(false);
            resizeCanvas();
            centerMap();
        });

        $('btnExitMap').addEventListener('click', () => {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if ((document.fullscreenElement || document.webkitFullscreenElement) && exit) {
                exit.call(document);
            }
            showPage('dashboard');
        });

        // Retour automatique au tableau de bord si l'utilisateur quitte le plein écran (Échap, geste système).
        function onFullscreenChange() {
            const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            if (active) {
                wasFullscreen = true;
            } else {
                if (wasFullscreen && isMapActive()) showPage('dashboard');
                wasFullscreen = false;
            }
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);

        /* ============================================================ */
        /* Géométrie                                                     */
        /* ============================================================ */

        function hexCenter(col, row) {
            return {
                x: HEX_WIDTH / 2 + col * HEX_WIDTH + (row % 2 === 1 ? HEX_WIDTH / 2 : 0),
                y: HEX_RADIUS + row * ROW_STEP
            };
        }

        function screenToWorld(sx, sy) {
            const dx = sx - view.panX;
            const dy = sy - view.panY;
            const cos = Math.cos(-view.rotation);
            const sin = Math.sin(-view.rotation);
            return {
                x: (dx * cos - dy * sin) / view.scale,
                y: (dx * sin + dy * cos) / view.scale
            };
        }

        // Retrouve directement la case sous un point du monde, sans parcourir toute la grille.
        function hexAtWorld(x, y) {
            const px = x - HEX_WIDTH / 2;
            const py = y - HEX_RADIUS;
            const q = ((Math.sqrt(3) / 3) * px - py / 3) / HEX_RADIUS;
            const r = ((2 / 3) * py) / HEX_RADIUS;
            const s = -q - r;

            let rq = Math.round(q);
            let rr = Math.round(r);
            const rs = Math.round(s);
            const dq = Math.abs(rq - q);
            const dr = Math.abs(rr - r);
            const ds = Math.abs(rs - s);
            if (dq > dr && dq > ds) rq = -rr - rs;
            else if (dr > ds) rr = -rq - rs;

            const row = rr;
            const col = rq + (rr - (rr & 1)) / 2;
            if (col < 0 || row < 0 || col >= state.cols || row >= state.rows) return null;
            return { col, row };
        }

        function visibleRange() {
            const corners = [[0, 0], [viewW, 0], [0, viewH], [viewW, viewH]].map(([x, y]) => screenToWorld(x, y));
            const xs = corners.map((p) => p.x);
            const ys = corners.map((p) => p.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);
            return {
                minCol: clamp(Math.floor(minX / HEX_WIDTH) - 2, 0, state.cols - 1),
                maxCol: clamp(Math.ceil(maxX / HEX_WIDTH) + 1, 0, state.cols - 1),
                minRow: clamp(Math.floor((minY - 2 * HEX_RADIUS) / ROW_STEP), 0, state.rows - 1),
                maxRow: clamp(Math.ceil(maxY / ROW_STEP), 0, state.rows - 1)
            };
        }

        /* ============================================================ */
        /* Rendu                                                         */
        /* ============================================================ */

        function resizeCanvas() {
            const rect = el.canvas.getBoundingClientRect();
            viewW = rect.width || window.innerWidth;
            viewH = rect.height || window.innerHeight;
            const ratio = window.devicePixelRatio || 1;
            el.canvas.width = Math.round(viewW * ratio);
            el.canvas.height = Math.round(viewH * ratio);
            requestDraw();
        }

        let drawQueued = false;
        function requestDraw() {
            if (drawQueued) return;
            drawQueued = true;
            requestAnimationFrame(() => {
                drawQueued = false;
                draw();
            });
        }

        function addHexPath(path, x, y) {
            path.moveTo(x + HEX_CORNERS[0][0], y + HEX_CORNERS[0][1]);
            for (let i = 1; i < 6; i++) path.lineTo(x + HEX_CORNERS[i][0], y + HEX_CORNERS[i][1]);
            path.closePath();
        }

        function draw() {
            if (!isMapActive()) return;

            el.compass.style.transform = `rotate(${-view.rotation}rad)`;

            const ratio = window.devicePixelRatio || 1;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = BACKGROUND;
            ctx.fillRect(0, 0, el.canvas.width, el.canvas.height);

            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.translate(view.panX, view.panY);
            ctx.rotate(view.rotation);
            ctx.scale(view.scale, view.scale);

            const { minCol, maxCol, minRow, maxRow } = visibleRange();
            const withOutline = HEX_RADIUS * view.scale >= 5;
            const fills = new Map(); // couleur -> Path2D (un seul tracé par couleur)
            const outline = new Path2D();

            for (let row = minRow; row <= maxRow; row++) {
                for (let col = minCol; col <= maxCol; col++) {
                    const { x, y } = hexCenter(col, row);
                    const color = state.gridData[`${col},${row}`]?.color ?? EMPTY_COLOR;
                    let path = fills.get(color);
                    if (!path) {
                        path = new Path2D();
                        fills.set(color, path);
                    }
                    addHexPath(path, x, y);
                    if (withOutline) addHexPath(outline, x, y);
                }
            }

            for (const [color, path] of fills) {
                ctx.fillStyle = color;
                ctx.fill(path);
                if (!withOutline) {
                    // Sans contour, on couvre les fines coutures entre cases.
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1 / view.scale;
                    ctx.stroke(path);
                }
            }

            if (withOutline) {
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1.5;
                ctx.stroke(outline);
            }
        }

        function centerMap() {
            view.rotation = 0;
            const gridWidth = state.cols * HEX_WIDTH + (state.rows > 1 ? HEX_WIDTH / 2 : 0);
            const gridHeight = HEX_RADIUS * 2 + (state.rows - 1) * ROW_STEP;
            const padding = 40;

            view.scale = Math.min((viewW - padding * 2) / gridWidth, (viewH - padding * 2) / gridHeight, 1);
            view.panX = (viewW - gridWidth * view.scale) / 2;
            view.panY = (viewH - gridHeight * view.scale) / 2;
            requestDraw();
        }

        $('btnResetView').addEventListener('click', centerMap);

        // Rotation autour du centre exact de l'écran.
        function rotateTo(degrees) {
            const cx = viewW / 2;
            const cy = viewH / 2;
            const world = screenToWorld(cx, cy);

            view.rotation = (degrees * Math.PI) / 180;
            const cos = Math.cos(view.rotation);
            const sin = Math.sin(view.rotation);
            view.panX = cx - (world.x * cos - world.y * sin) * view.scale;
            view.panY = cy - (world.x * sin + world.y * cos) * view.scale;
            requestDraw();
        }

        document.querySelectorAll('.compass-btn').forEach((button) => {
            button.addEventListener('click', () => rotateTo(Number(button.dataset.angle)));
        });

        window.addEventListener('resize', () => { if (isMapActive()) resizeCanvas(); });

        /* ============================================================ */
        /* Peinture                                                      */
        /* ============================================================ */

        function applyPaint(key) {
            state.gridData[key] = { color: state.activeColor, author: state.username };
            requestDraw();
            socket?.emit('paint-tile', { key, color: state.activeColor });
        }

        function openOverrideModal(key, author) {
            pendingTileKey = key;
            const strong = document.createElement('strong');
            strong.textContent = author; // textContent : le pseudo n'est jamais interprété comme du HTML
            el.overrideMessage.replaceChildren(
                document.createTextNode("L'utilisateur "),
                strong,
                document.createTextNode(' a déjà modifié cette case.'),
                document.createElement('br'),
                document.createTextNode('Voulez-vous la remplacer ?')
            );
            el.overrideModal.hidden = false;
        }

        function paintAt(clientX, clientY) {
            if (state.isLocked || !state.paintMode || !state.activeColor) return;

            const rect = el.canvas.getBoundingClientRect();
            const world = screenToWorld(clientX - rect.left, clientY - rect.top);
            const hex = hexAtWorld(world.x, world.y);
            if (!hex) return;

            const key = `${hex.col},${hex.row}`;
            const existing = state.gridData[key];
            if (existing?.color === state.activeColor) return;

            if (existing?.author && existing.author !== state.username) {
                endGestures();
                openOverrideModal(key, existing.author);
                return;
            }
            applyPaint(key);
        }

        $('btnConfirmOverride').addEventListener('click', () => {
            if (pendingTileKey && !state.isLocked) applyPaint(pendingTileKey);
            pendingTileKey = null;
            el.overrideModal.hidden = true;
        });

        $('btnCancelOverride').addEventListener('click', () => {
            pendingTileKey = null;
            el.overrideModal.hidden = true;
        });

        /* ============================================================ */
        /* Gestes (souris et tactile via Pointer Events)                 */
        /* ============================================================ */

        const pointers = new Map(); // pointerId -> { x, y }
        let gesture = null;

        function endGestures() {
            pointers.clear();
            gesture = null;
        }

        function beginGesture() {
            const previous = gesture;
            const active = [...pointers.values()];

            if (active.length === 1) {
                const [p] = active;
                gesture = {
                    type: 'single',
                    startX: p.x - view.panX,
                    startY: p.y - view.panY,
                    // Après un pincement, le doigt restant déplace la carte au lieu de peindre.
                    panOnly: previous?.type === 'pinch'
                };
            } else if (active.length === 2) {
                const [a, b] = active;
                const rect = el.canvas.getBoundingClientRect();
                gesture = {
                    type: 'pinch',
                    distance: Math.hypot(b.x - a.x, b.y - a.y) || 1,
                    angle: Math.atan2(b.y - a.y, b.x - a.x),
                    scale: view.scale,
                    rotation: view.rotation,
                    anchor: screenToWorld((a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top)
                };
            } else {
                gesture = null;
            }
        }

        el.canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            el.canvas.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            beginGesture();
            if (gesture?.type === 'single') paintAt(e.clientX, e.clientY);
        });

        el.canvas.addEventListener('pointermove', (e) => {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (!gesture) return;

            if (gesture.type === 'single') {
                if (state.paintMode && !state.isLocked && !gesture.panOnly) {
                    paintAt(e.clientX, e.clientY);
                } else {
                    view.panX = e.clientX - gesture.startX;
                    view.panY = e.clientY - gesture.startY;
                    requestDraw();
                }
                return;
            }

            // Pincement : zoom, rotation et déplacement à deux doigts, ancrés sur le point de départ.
            const [a, b] = [...pointers.values()];
            const rect = el.canvas.getBoundingClientRect();
            const distance = Math.hypot(b.x - a.x, b.y - a.y) || 1;
            const angle = Math.atan2(b.y - a.y, b.x - a.x);

            view.scale = clamp(gesture.scale * (distance / gesture.distance), MIN_SCALE, MAX_SCALE);
            view.rotation = gesture.rotation + (angle - gesture.angle);

            const cos = Math.cos(view.rotation);
            const sin = Math.sin(view.rotation);
            const cx = (a.x + b.x) / 2 - rect.left;
            const cy = (a.y + b.y) / 2 - rect.top;
            view.panX = cx - (gesture.anchor.x * cos - gesture.anchor.y * sin) * view.scale;
            view.panY = cy - (gesture.anchor.x * sin + gesture.anchor.y * cos) * view.scale;
            requestDraw();
        });

        function releasePointer(e) {
            if (!pointers.delete(e.pointerId)) return;
            if (el.canvas.hasPointerCapture(e.pointerId)) el.canvas.releasePointerCapture(e.pointerId);
            beginGesture();
        }
        el.canvas.addEventListener('pointerup', releasePointer);
        el.canvas.addEventListener('pointercancel', releasePointer);

        el.canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = el.canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const newScale = clamp(view.scale * (e.deltaY < 0 ? 1.1 : 0.9), MIN_SCALE, MAX_SCALE);
            const ratio = newScale / view.scale;
            view.panX = mouseX - (mouseX - view.panX) * ratio;
            view.panY = mouseY - (mouseY - view.panY) * ratio;
            view.scale = newScale;
            requestDraw();
        }, { passive: false });

        /* ============================================================ */
        /* Événements serveur                                            */
        /* ============================================================ */

        if (socket) {
            socket.on('connect', () => {
                // Après une coupure réseau, on se ré-identifie automatiquement.
                if (state.username) authenticate(state.username, state.password, true);
            });

            socket.on('init', (data) => {
                const sizeChanged = data.config && (data.config.cols !== state.cols || data.config.rows !== state.rows);

                state.gridData = data.gridData || {};
                state.cols = data.config?.cols ?? 10;
                state.rows = data.config?.rows ?? 8;
                state.isLocked = Boolean(data.isLocked);
                state.terrains = data.terrains || [];
                updateUsers(data.users || []);

                updateLockUI();
                renderTerrains();

                if (isMapActive()) {
                    if (sizeChanged) centerMap();
                    else requestDraw();
                }
            });

            socket.on('update-users-list', updateUsers);

            socket.on('update-terrains', (terrains) => {
                state.terrains = terrains;
                renderTerrains();
            });

            socket.on('update-lock', (locked) => {
                state.isLocked = Boolean(locked);
                updateLockUI();
            });

            socket.on('update-tile', ({ key, color, author }) => {
                state.gridData[key] = { color, author };
                requestDraw();
            });

            socket.on('update-config', ({ config, gridData }) => {
                state.cols = config.cols;
                state.rows = config.rows;
                state.gridData = gridData || {};
                if (isMapActive()) centerMap();
            });

            socket.on('maps-list', (maps) => {
                state.maps = maps;
                renderMaps();
            });

            socket.on('kicked', (message) => {
                state.username = '';
                state.password = '';
                state.isAdmin = false;
                applyRole();
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if ((document.fullscreenElement || document.webkitFullscreenElement) && exit) exit.call(document);
                showLoginError(message);
                showPage('login');
            });
        }

        /* ============================================================ */
        /* Démarrage                                                     */
        /* ============================================================ */

        applyRole();
        renderMaps();
        updateLockUI();
        if (!socket) showLoginError('Impossible de joindre le serveur.');
    })();
    </script>
</body>
</html>
