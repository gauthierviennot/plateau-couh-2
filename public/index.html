<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plateau Hexagonal Collaboratif</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --dark: #2c3e50;
            --slate: #34495e;
            --blue: #3498db;
            --green: #2ecc71;
            --green-dark: #27ae60;
            --red: #e74c3c;
            --orange: #e67e22;
            --grey: #95a5a6;
            --muted: #7f8c8d;
            --border: #ddd;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
        input { user-select: text; -webkit-user-select: text; }
        [hidden] { display: none !important; }

        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #333; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

        .page { display: none; position: absolute; inset: 0; }
        .page.active { display: flex; }

        /* Boutons communs */
        .btn { padding: 10px 14px; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 0.9rem; }
        .btn-primary { background: var(--blue); }
        .btn-dark { background: var(--slate); }
        .btn-danger { background: var(--red); }
        .btn-secondary { background: var(--grey); }
        .btn-small { padding: 6px 10px; font-size: 0.8rem; }

        /* Page 1 : connexion */
        #pageLogin { background: var(--dark); justify-content: center; align-items: center; }
        .login-card { background: #fff; padding: 30px; border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.2); width: 90%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .login-card h1 { font-size: 1.4rem; color: var(--dark); }
        .login-card input { padding: 12px; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; text-align: center; width: 100%; }
        .login-card .btn { padding: 12px; font-size: 1rem; }
        .error { color: var(--red); font-size: 0.85rem; font-weight: 600; }
        .error.info { color: var(--muted); }

        /* Page 2 : tableau de bord */
        #pageDashboard { background: #e5e9f0; justify-content: center; align-items: center; padding: 16px; }
        .dashboard-card { background: #fff; padding: 20px; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,.1); width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; touch-action: pan-y; }
        .dashboard-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 2px solid var(--blue); padding-bottom: 8px; }
        .dashboard-header h2 { font-size: 1.2rem; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .header-actions { display: flex; flex-wrap: wrap; gap: 6px; }
        .section-title { font-weight: bold; font-size: 0.85rem; color: var(--muted); margin-top: 5px; }

        .user-list { background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; max-height: 100px; overflow-y: auto; font-size: 0.85rem; }
        .user-item { padding: 3px 0; display: flex; align-items: center; gap: 6px; color: var(--dark); font-weight: 500; }
        .user-item::before { content: "•"; color: var(--green); font-weight: bold; }

        .terrain-palette { display: flex; flex-direction: column; gap: 6px; }
        .terrain-item { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 6px; border: 1px solid var(--border); border-radius: 6px; }
        .terrain-color-preview { width: 28px; height: 28px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); flex-shrink: 0; }
        .terrain-color-input { width: 32px; height: 32px; border: none; background: none; flex-shrink: 0; }
        .terrain-label-text { font-size: 0.9rem; font-weight: 600; color: var(--slate); }
        .terrain-label-input { flex: 1; min-width: 0; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }

        .map-save { display: flex; gap: 6px; }
        .map-save input { flex: 1; min-width: 0; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .map-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
        .map-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f8f9fa; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
        .map-info { min-width: 0; display: flex; flex-direction: column; }
        .map-name { font-size: 0.9rem; font-weight: 600; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .map-meta { font-size: 0.72rem; color: var(--muted); }
        .map-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .empty { font-size: 0.85rem; color: var(--muted); }

        .btn-go { position: sticky; bottom: 0; margin-top: auto; padding: 14px; border: none; border-radius: 8px; background: var(--green); color: #fff; font-weight: bold; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(46,204,113,.3); flex-shrink: 0; }
        .btn-go:hover { background: var(--green-dark); }

        /* Page 3 : carte */
        #pageMap { background: var(--dark); overflow: hidden; touch-action: none; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

        .btn-exit { position: absolute; top: 15px; left: 15px; z-index: 50; width: 42px; height: 42px; background: var(--red); color: #fff; border: none; border-radius: 50%; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
        .mini-user-list { position: absolute; top: 65px; left: 15px; z-index: 50; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); padding: 6px 10px; border-radius: 6px; color: #fff; font-size: 0.7rem; max-width: 140px; max-height: 90px; overflow-y: auto; pointer-events: none; }
        .mini-user-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .mini-user-item::before { content: "•"; color: var(--green); }

        .fullscreen-palette { position: absolute; top: 165px; left: 15px; z-index: 50; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.9); padding: 10px; border-radius: var(--radius); backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,.2); max-height: calc(100% - 260px); overflow-y: auto; touch-action: pan-y; }
        .hex-option { width: 34px; height: 34px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border: none; flex-shrink: 0; transition: transform .2s; }
        .hex-option.selected { transform: scale(1.25); filter: drop-shadow(0 0 5px #000); }
        .palette-tooltip { position: fixed; z-index: 60; padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.88); color: #fff; font-size: 0.85rem; white-space: nowrap; pointer-events: none; }

        .map-toolbar { position: absolute; top: 15px; right: 15px; z-index: 50; display: flex; justify-content: flex-end; gap: 8px; max-width: calc(100% - 80px); }
        .admin-tools { position: absolute; top: 70px; right: 15px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
        .btn-round { width: 42px; height: 42px; border: none; border-radius: 50%; background: #fff; font-size: 1.15rem; line-height: 1; box-shadow: 0 4px 10px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-round.lock { background: var(--green); }
        .btn-round.lock.locked { background: var(--red); }
        .btn-round.mode { color: #fff; }
        .btn-round.mode.move { background: var(--blue); }
        .btn-round.mode.paint { background: var(--green); }
        .btn-round.active { outline: 3px solid var(--dark); background: #ffeaa7; }

        .selection-bar { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(255,255,255,.94); border-radius: 26px; box-shadow: 0 4px 15px rgba(0,0,0,.3); max-width: 96%; }
        .selection-bar .btn-round { width: 38px; height: 38px; font-size: 1rem; box-shadow: none; background: #f1f3f5; }
        .selection-count { font-size: 0.8rem; font-weight: 600; color: var(--dark); white-space: nowrap; }

        .rotate-controls { position: absolute; bottom: 20px; right: 20px; z-index: 50; display: flex; gap: 10px; }
        .rotate-controls .btn-round { width: 48px; height: 48px; font-size: 1.5rem; }

        /* Fenêtres modales et notifications */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: min(320px, 92vw); box-shadow: 0 4px 20px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; }
        .modal-wide { width: min(420px, 94vw); max-height: 90%; }
        .modal-content p { font-size: 0.85rem; color: var(--dark); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.8rem; font-weight: 600; }
        .control-group input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }

        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; max-width: 90vw; padding: 10px 16px; border-radius: 8px; background: var(--dark); color: #fff; font-size: 0.85rem; box-shadow: 0 4px 12px rgba(0,0,0,.3); pointer-events: none; }
        .toast.error { background: var(--red); }
    </style>
</head>
<body>

    <!-- PAGE 1 : connexion -->
    <main id="pageLogin" class="page active">
        <div class="login-card">
            <h1>Plateau Hexagonal</h1>
            <input type="text" id="usernameInput" placeholder="Entrez votre pseudo" maxlength="15" autocomplete="off" autofocus>
            <input type="password" id="passwordInput" placeholder="Mot de passe administrateur" autocomplete="current-password" hidden>
            <p id="loginError" class="error" role="alert" hidden></p>
            <button id="btnLogin" class="btn btn-primary">Rejoindre</button>
        </div>
    </main>

    <!-- PAGE 2 : tableau de bord -->
    <main id="pageDashboard" class="page">
        <div class="dashboard-card">
            <div class="dashboard-header">
                <h2 id="welcomeUser">Bienvenue !</h2>
                <div class="header-actions">
                    <button id="btnOpenMaps" class="btn btn-primary admin-only" hidden>🗺️ Cartes</button>
                    <button id="btnAdminConfig" class="btn btn-dark admin-only" hidden>⚙️ Plateau</button>
                    <button id="btnLogout" class="btn btn-secondary">Déconnexion</button>
                </div>
            </div>

            <div class="section-title">Joueurs en ligne</div>
            <div id="onlineUsers" class="user-list"></div>

            <div class="section-title">Couleurs et légendes</div>
            <div id="terrainContainer" class="terrain-palette"></div>
            <button id="btnAddTerrain" class="btn btn-secondary admin-only" hidden>＋ Ajouter une couleur</button>

            <button id="btnGo" class="btn-go">🚀 GO !</button>
        </div>

        <div id="configModal" class="modal-overlay" hidden>
            <div class="modal-content">
                <h3>Taille du plateau</h3>
                <div class="control-group">
                    <label for="cols">Colonnes (largeur)</label>
                    <input type="number" id="cols" value="10" min="2" max="300">
                </div>
                <div class="control-group">
                    <label for="rows">Lignes (longueur)</label>
                    <input type="number" id="rows" value="8" min="2" max="300">
                </div>
                <p>Changer la taille vide le plateau. Une sauvegarde automatique est créée avant.</p>
                <div class="modal-actions">
                    <button id="btnCloseModal" class="btn btn-secondary">Annuler</button>
                    <button id="btnApplyConfig" class="btn btn-danger">Appliquer</button>
                </div>
            </div>
        </div>
    </main>

    <!-- PAGE 3 : carte -->
    <main id="pageMap" class="page">
        <button id="btnExitMap" class="btn-exit" title="Quitter la carte" aria-label="Quitter la carte">✖</button>
        <div id="miniOnlineUsers" class="mini-user-list"></div>
        <div id="fsPalette" class="fullscreen-palette"></div>

        <div class="map-toolbar">
            <button id="btnLockToggle" class="btn-round lock admin-only" title="Verrouiller le plateau" aria-label="Verrouiller le plateau" hidden>🔓</button>
            <button id="btnMapsToolbar" class="btn-round admin-only" title="Cartes enregistrées" aria-label="Cartes enregistrées" hidden>🗺️</button>
            <button id="btnResetView" class="btn-round" title="Centrer la carte" aria-label="Centrer la carte">🎯</button>
            <button id="btnModeToggle" class="btn-round mode move" title="Mode déplacer : toucher pour peindre" aria-label="Mode déplacer : toucher pour peindre">✋</button>
        </div>

        <div id="adminTools" class="admin-tools" hidden>
            <button id="btnSelect" class="btn-round" title="Sélectionner plusieurs hexagones avec un rectangle" aria-label="Sélection par rectangle">⛶</button>
            <button id="btnErase" class="btn-round" title="Supprimer des hexagones" aria-label="Supprimer des hexagones">✂️</button>
            <button id="btnRestore" class="btn-round" title="Rétablir des hexagones" aria-label="Rétablir des hexagones">↩️</button>
            <button id="btnArrow" class="btn-round" title="Ajouter ou retirer une flèche" aria-label="Ajouter ou retirer une flèche">➡️</button>
        </div>

        <div id="selectionBar" class="selection-bar" hidden>
            <span id="selectionCount" class="selection-count"></span>
            <button id="btnSelPaint" class="btn-round" title="Colorier la sélection avec la couleur choisie" aria-label="Colorier la sélection">🎨</button>
            <button id="btnSelRemove" class="btn-round" title="Supprimer les hexagones sélectionnés" aria-label="Supprimer la sélection">✂️</button>
            <button id="btnSelRestore" class="btn-round" title="Rétablir les hexagones supprimés" aria-label="Rétablir la sélection">↩️</button>
            <button id="btnSelArrow" class="btn-round" title="Ajouter une flèche" aria-label="Ajouter une flèche à la sélection">➡️</button>
            <button id="btnSelNoArrow" class="btn-round" title="Retirer les flèches" aria-label="Retirer les flèches de la sélection">🚫</button>
            <button id="btnSelClear" class="btn-round" title="Annuler la sélection" aria-label="Annuler la sélection">✖</button>
        </div>

        <div class="rotate-controls">
            <button id="btnRotateLeft" class="btn-round" title="Pivoter de 90° vers la gauche" aria-label="Pivoter de 90 degrés vers la gauche">↺</button>
            <button id="btnRotateRight" class="btn-round" title="Pivoter de 90° vers la droite" aria-label="Pivoter de 90 degrés vers la droite">↻</button>
        </div>

        <canvas id="hexCanvas"></canvas>

        <div id="overrideModal" class="modal-overlay" hidden>
            <div class="modal-content">
                <h3>Remplacer la case ?</h3>
                <p id="overrideMessage"></p>
                <div class="modal-actions">
                    <button id="btnCancelOverride" class="btn btn-secondary">Annuler</button>
                    <button id="btnConfirmOverride" class="btn btn-danger">Confirmer</button>
                </div>
            </div>
        </div>

        <div id="paletteTooltip" class="palette-tooltip" hidden></div>
    </main>

    <div id="mapsModal" class="modal-overlay" hidden>
        <div class="modal-content modal-wide">
            <h3>Cartes enregistrées</h3>
            <div class="map-save">
                <input type="text" id="mapNameInput" placeholder="Nom de la carte à enregistrer" maxlength="60" autocomplete="off">
                <button id="btnSaveMap" class="btn btn-primary">💾 Enregistrer</button>
            </div>
            <div id="mapList" class="map-list"></div>
            <div class="modal-actions">
                <button id="btnCloseMaps" class="btn btn-secondary">Fermer</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script>
    (() => {
        'use strict';

        /* ============================================================ */
        /* Constantes et état                                            */
        /* ============================================================ */

        const HEX_RADIUS = 35;
        const HEX_WIDTH = Math.sqrt(3) * HEX_RADIUS;
        const ROW_STEP = HEX_RADIUS * 1.5;
        const MIN_SCALE = 0.05;
        const MAX_SCALE = 5;
        const MIN_SIZE = 2;
        const MAX_SIZE = 300;
        const MAX_TERRAINS = 30;
        const EMPTY_COLOR = '#ffffff';
        const BACKGROUND = '#ecf0f1';
        const REQUEST_TIMEOUT_MS = 8000;
        const DOUBLE_TAP_MS = 300;
        const SESSION_KEY = 'hexSession';
        const ADMIN_MODES = new Set(['select', 'erase', 'restore', 'arrow']);

        const HEX_CORNERS = Array.from({ length: 6 }, (_, i) => {
            const angle = (Math.PI / 180) * (60 * i - 30);
            return [HEX_RADIUS * Math.cos(angle), HEX_RADIUS * Math.sin(angle)];
        });

        const $ = (id) => document.getElementById(id);
        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

        const socket = typeof io !== 'undefined' ? io() : null;

        const state = {
            username: '',
            isAdmin: false,
            isLocked: false,
            mode: 'move', // move | paint | select | erase | restore | arrow
            activeColor: null,
            cols: 10,
            rows: 8,
            gridData: {},
            terrains: [],
            maps: [],
            selection: new Set()
        };

        const view = { scale: 1, panX: 0, panY: 0, rotation: 0 };
        let viewW = window.innerWidth;
        let viewH = window.innerHeight;
        let pendingTileKey = null;
        let pendingTap = null;
        let dragRect = null;
        let wasFullscreen = false;
        let lastVisibilityChange = 0;
        let tooltipTimer = null;
        let toastTimer = null;
        let drawQueued = false;

        const el = {
            pages: { login: $('pageLogin'), dashboard: $('pageDashboard'), map: $('pageMap') },
            username: $('usernameInput'),
            password: $('passwordInput'),
            loginError: $('loginError'),
            btnLogin: $('btnLogin'),
            welcome: $('welcomeUser'),
            onlineUsers: $('onlineUsers'),
            miniUsers: $('miniOnlineUsers'),
            terrainContainer: $('terrainContainer'),
            fsPalette: $('fsPalette'),
            mapName: $('mapNameInput'),
            mapList: $('mapList'),
            mapsModal: $('mapsModal'),
            configModal: $('configModal'),
            overrideModal: $('overrideModal'),
            overrideMessage: $('overrideMessage'),
            btnLock: $('btnLockToggle'),
            btnMode: $('btnModeToggle'),
            adminTools: $('adminTools'),
            btnSelect: $('btnSelect'),
            btnErase: $('btnErase'),
            btnRestore: $('btnRestore'),
            btnArrow: $('btnArrow'),
            selectionBar: $('selectionBar'),
            selectionCount: $('selectionCount'),
            tooltip: $('paletteTooltip'),
            canvas: $('hexCanvas'),
            toast: $('toast')
        };
        const ctx = el.canvas.getContext('2d');
        const toolButtons = { select: el.btnSelect, erase: el.btnErase, restore: el.btnRestore, arrow: el.btnArrow };

        /* ============================================================ */
        /* Identité et session (conservée même après mise en veille)     */
        /* ============================================================ */

        const clientId = (() => {
            const fresh = () => (window.crypto?.randomUUID?.() ?? `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`);
            try {
                let id = localStorage.getItem('hexClientId');
                if (!id) {
                    id = fresh();
                    localStorage.setItem('hexClientId', id);
                }
                return id;
            } catch {
                return fresh();
            }
        })();

        function loadSession() {
            try {
                const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
                return session?.token ? session : null;
            } catch {
                return null;
            }
        }

        function saveSession(token, name) {
            try { localStorage.setItem(SESSION_KEY, JSON.stringify({ token, name })); } catch { /* stockage indisponible */ }
        }

        function clearSession() {
            try { localStorage.removeItem(SESSION_KEY); } catch { /* stockage indisponible */ }
        }

        /* ============================================================ */
        /* Utilitaires d'interface                                       */
        /* ============================================================ */

        function showPage(name) {
            for (const [key, page] of Object.entries(el.pages)) {
                page.classList.toggle('active', key === name);
            }
        }

        const isMapActive = () => el.pages.map.classList.contains('active');

        function toast(message, isError = false) {
            el.toast.textContent = message;
            el.toast.classList.toggle('error', isError);
            el.toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.toast.hidden = true; }, 3200);
        }

        function request(event, payload) {
            return new Promise((resolve) => {
                if (!socket) return resolve({ success: false, code: 'network', message: 'Serveur injoignable.' });
                socket.timeout(REQUEST_TIMEOUT_MS).emit(event, payload, (err, res) => {
                    if (err || !res) resolve({ success: false, code: 'network', message: 'Le serveur ne répond pas.' });
                    else resolve(res);
                });
            });
        }

        function showLoginError(message, isError = true) {
            el.loginError.textContent = message || '';
            el.loginError.classList.toggle('info', !isError);
            el.loginError.hidden = !message;
        }

        function leaveFullscreen() {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if ((document.fullscreenElement || document.webkitFullscreenElement) && exit) exit.call(document);
        }

        function applyRole() {
            document.querySelectorAll('.admin-only').forEach((node) => { node.hidden = !state.isAdmin; });
            updateLockUI();
        }

        function updateUsers(users) {
            el.onlineUsers.replaceChildren();
            el.miniUsers.replaceChildren();
            for (const name of users) {
                const item = document.createElement('div');
                item.className = 'user-item';
                item.textContent = name;
                el.onlineUsers.appendChild(item);

                const mini = document.createElement('div');
                mini.className = 'mini-user-item';
                mini.textContent = name;
                el.miniUsers.appendChild(mini);
            }
        }

        /* ============================================================ */
        /* Connexion / déconnexion                                       */
        /* ============================================================ */

        el.username.addEventListener('input', () => {
            el.password.hidden = el.username.value.trim().toLowerCase() !== 'admin';
        });

        // credentials : { name, password } pour une connexion, ou { token } pour reprendre une session.
        async function authenticate(credentials, isReconnect) {
            const res = await request('set-username', { ...credentials, clientId });

            if (!res.success) {
                if (res.code === 'network') {
                    if (!isReconnect) showLoginError(res.message);
                    return;
                }
                clearSession();
                state.username = '';
                state.isAdmin = false;
                leaveFullscreen();
                applyRole();
                showLoginError(res.message);
                showPage('login');
                return;
            }

            state.username = res.name;
            state.isAdmin = Boolean(res.isAdmin);
            saveSession(res.token, res.name);
            el.welcome.textContent = `Joueur : ${res.name}`;

        // Retour au tableau de bord si l'utilisateur quitte le plein écran (Échap, geste système),
        // sauf si c'est la mise en veille du téléphone qui l'a provoqué.

        /* ============================================================ */
        /* Géométrie                                                     */
        /* ============================================================ */

        function hexCenter(col, row) {
            return {
                x: HEX_WIDTH / 2 + col * HEX_WIDTH + (row % 2 === 1 ? HEX_WIDTH / 2 : 0),
                y: HEX_RADIUS + row * ROW_STEP
            };
        }

        function screenToWorld(sx, sy) {
            const dx = sx - view.panX;
            const dy = sy - view.panY;
            const cos = Math.cos(-view.rotation);
            const sin = Math.sin(-view.rotation);
            return {
                x: (dx * cos - dy * sin) / view.scale,
                y: (dx * sin + dy * cos) / view.scale
            };
        }

        // Retrouve directement la case sous un point du monde, sans parcourir toute la grille.
        function hexAtWorld(x, y) {
            const px = x - HEX_WIDTH / 2;
            const py = y - HEX_RADIUS;
            const q = ((Math.sqrt(3) / 3) * px - py / 3) / HEX_RADIUS;
            const r = ((2 / 3) * py) / HEX_RADIUS;
            const s = -q - r;

            let rq = Math.round(q);
            let rr = Math.round(r);
            const rs = Math.round(s);
            const dq = Math.abs(rq - q);
            const dr = Math.abs(rr - r);
            const ds = Math.abs(rs - s);
            if (dq > dr && dq > ds) rq = -rr - rs;
            else if (dr > ds) rr = -rq - rs;

            const row = rr;
            const col = rq + (rr - (rr & 1)) / 2;
            if (col < 0 || row < 0 || col >= state.cols || row >= state.rows) return null;
            return { col, row };
        }

        function tileKeyAt(clientX, clientY) {
            const rect = el.canvas.getBoundingClientRect();
            const world = screenToWorld(clientX - rect.left, clientY - rect.top);
            const hex = hexAtWorld(world.x, world.y);
            return hex ? `${hex.col},${hex.row}` : null;
        }

        function visibleRange() {
            const corners = [[0, 0], [viewW, 0], [0, viewH], [viewW, viewH]].map(([x, y]) => screenToWorld(x, y));
            const xs = corners.map((p) => p.x);
            const ys = corners.map((p) => p.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);
            return {
                minCol: clamp(Math.floor(minX / HEX_WIDTH) - 2, 0, state.cols - 1),
                maxCol: clamp(Math.ceil(maxX / HEX_WIDTH) + 1, 0, state.cols - 1),
                minRow: clamp(Math.floor((minY - 2 * HEX_RADIUS) / ROW_STEP), 0, state.rows - 1),
                maxRow: clamp(Math.ceil(maxY / ROW_STEP), 0, state.rows - 1)
            };
        }

        /* ============================================================ */
        /* Rendu                                                         */
        /* ============================================================ */

        function resizeCanvas() {
            const rect = el.canvas.getBoundingClientRect();
            viewW = rect.width || window.innerWidth;
            viewH = rect.height || window.innerHeight;
            const ratio = window.devicePixelRatio || 1;
            el.canvas.width = Math.round(viewW * ratio);
            el.canvas.height = Math.round(viewH * ratio);
            requestDraw();
        }

        function requestDraw() {
            if (drawQueued) return;
            drawQueued = true;
            requestAnimationFrame(() => {
                drawQueued = false;
                draw();
            });
        }

        function addHexPath(path, x, y) {
            path.moveTo(x + HEX_CORNERS[0][0], y + HEX_CORNERS[0][1]);
            for (let i = 1; i < 6; i++) path.lineTo(x + HEX_CORNERS[i][0], y + HEX_CORNERS[i][1]);
            path.closePath();
        }

        function luminance(hex) {
            const n = Number.parseInt(hex.slice(1), 16);
            return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
        }

        // Flèche passant par le milieu de deux côtés opposés : direction = numéro × 60°.
        function drawArrow(x, y, direction, color) {
            const half = HEX_RADIUS * 0.7;
            const head = HEX_RADIUS * 0.38;
            const wing = HEX_RADIUS * 0.26;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(direction * (Math.PI / 3));
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = HEX_RADIUS * 0.12;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(-half, 0);
            ctx.lineTo(half - head * 0.5, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(half, 0);
            ctx.lineTo(half - head, -wing);
            ctx.lineTo(half - head, wing);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            if (!isMapActive()) return;

            const ratio = window.devicePixelRatio || 1;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = BACKGROUND;
            ctx.fillRect(0, 0, el.canvas.width, el.canvas.height);

            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.translate(view.panX, view.panY);
            ctx.rotate(view.rotation);
            ctx.scale(view.scale, view.scale);

            const { minCol, maxCol, minRow, maxRow } = visibleRange();
            const withOutline = HEX_RADIUS * view.scale >= 5;
            const withArrows = HEX_RADIUS * view.scale >= 8;
            const showGhosts = state.isAdmin && (state.mode === 'erase' || state.mode === 'restore' || state.mode === 'select');
            const selected = state.selection;

            const fills = new Map(); // couleur -> Path2D (un seul tracé par couleur)
            const outline = new Path2D();
            const ghosts = new Path2D();
            const selectionPath = new Path2D();
            const arrows = [];

            for (let row = minRow; row <= maxRow; row++) {
                for (let col = minCol; col <= maxCol; col++) {
                    const key = `${col},${row}`;
                    const { x, y } = hexCenter(col, row);
                    const tile = state.gridData[key];

                    if (selected.size > 0 && selected.has(key)) addHexPath(selectionPath, x, y);

                    if (tile?.removed) {
                        // Case supprimée : invisible, sauf pour l'admin en mode suppression / sélection.
                        if (showGhosts) addHexPath(ghosts, x, y);
                        continue;
                    }

                    const color = tile?.color ?? EMPTY_COLOR;
                    let path = fills.get(color);
                    if (!path) {
                        path = new Path2D();
                        fills.set(color, path);
                    }
                    addHexPath(path, x, y);
                    if (withOutline) addHexPath(outline, x, y);

                    if (withArrows && Number.isInteger(tile?.arrow)) {
                        arrows.push({ x, y, direction: tile.arrow, color: luminance(color) > 0.55 ? '#111111' : '#ffffff' });
                    }
                }
            }

            for (const [color, path] of fills) {
                ctx.fillStyle = color;
                ctx.fill(path);
                if (!withOutline) {
                    // Sans contour, on couvre les fines coutures entre cases.
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1 / view.scale;
                    ctx.stroke(path);
                }
            }

            if (withOutline) {
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 1.5;
                ctx.stroke(outline);
            }

            for (const arrow of arrows) drawArrow(arrow.x, arrow.y, arrow.direction, arrow.color);

            if (showGhosts) {
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.stroke(ghosts);
                ctx.setLineDash([]);
            }

            if (selected.size > 0) {
                ctx.fillStyle = 'rgba(52, 152, 219, 0.3)';
                ctx.fill(selectionPath);
                ctx.strokeStyle = '#1f78ff';
                ctx.lineWidth = 3;
                ctx.stroke(selectionPath);
            }

            if (dragRect) {
                // Rectangle de sélection, tracé en coordonnées d'écran.
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                const left = Math.min(dragRect.x1, dragRect.x2);
                const top = Math.min(dragRect.y1, dragRect.y2);
                const width = Math.abs(dragRect.x2 - dragRect.x1);
                const height = Math.abs(dragRect.y2 - dragRect.y1);
                ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
                ctx.fillRect(left, top, width, height);
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = '#1f78ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(left, top, width, height);
                ctx.setLineDash([]);
            }
        }

        function centerMap() {
            view.rotation = 0;
            const gridWidth = state.cols * HEX_WIDTH + (state.rows > 1 ? HEX_WIDTH / 2 : 0);
            const gridHeight = HEX_RADIUS * 2 + (state.rows - 1) * ROW_STEP;
            const padding = 40;

            view.scale = Math.min((viewW - padding * 2) / gridWidth, (viewH - padding * 2) / gridHeight, 1);
            view.panX = (viewW - gridWidth * view.scale) / 2;
            view.panY = (viewH - gridHeight * view.scale) / 2;
            requestDraw();
        }

        $('btnResetView').addEventListener('click', centerMap);

        // Rotation de 90° autour du centre exact de l'écran.
        function rotateBy(degrees) {
            const cx = viewW / 2;
            const cy = viewH / 2;
            const world = screenToWorld(cx, cy);

            view.rotation += (degrees * Math.PI) / 180;
            const cos = Math.cos(view.rotation);
            const sin = Math.sin(view.rotation);
            view.panX = cx - (world.x * cos - world.y * sin) * view.scale;
            view.panY = cy - (world.x * sin + world.y * cos) * view.scale;
            requestDraw();
        }

        $('btnRotateLeft').addEventListener('click', () => rotateBy(-90));
        $('btnRotateRight').addEventListener('click', () => rotateBy(90));

        window.addEventListener('resize', () => { if (isMapActive()) resizeCanvas(); });

        /* ============================================================ */
        /* Outils sur les cases                                          */
        /* ============================================================ */

        function applyPaint(key) {
            const existing = state.gridData[key];
            state.gridData[key] = { ...existing, color: state.activeColor, author: state.username };
            requestDraw();
            socket?.emit('paint-tile', { key, color: state.activeColor });
        }

        function openOverrideModal(key, author) {
            pendingTileKey = key;
            const strong = document.createElement('strong');
            strong.textContent = author; // textContent : le pseudo n'est jamais interprété comme du HTML
            el.overrideMessage.replaceChildren(
                document.createTextNode("L'utilisateur "),
                strong,
                document.createTextNode(' a déjà modifié cette case.'),
                document.createElement('br'),
                document.createTextNode('Voulez-vous la remplacer ?')
            );
            el.overrideModal.hidden = false;
        }

        function paintTile(key) {
            if (state.isLocked) return;
            const existing = state.gridData[key];

            // Une case supprimée ne peut pas être coloriée.
            if (!state.activeColor || existing?.removed || existing?.color === state.activeColor) return;

            if (existing?.author && existing.author !== state.username) {
                endGestures();
                openOverrideModal(key, existing.author);
                return;
            }
            applyPaint(key);
        }

        function clearPendingTap() {
            if (pendingTap) clearTimeout(pendingTap.timer);
            pendingTap = null;
        }

        // Mode peindre, toucher initial : un double toucher sur une flèche la fait tourner d'un sixième de tour.
        // Sur une case à flèche, la peinture d'un simple toucher est retardée pour laisser le temps du second toucher.
        function handlePaintDown(clientX, clientY) {
            if (state.isLocked) return;
            const key = tileKeyAt(clientX, clientY);
            if (!key) return;

            const tile = state.gridData[key];
            const hasArrow = Number.isInteger(tile?.arrow) && !tile.removed;

            if (!hasArrow) {
                clearPendingTap();
                paintTile(key);
                return;
            }

            if (pendingTap?.key === key) {
                clearPendingTap();
                socket?.emit('rotate-arrow', { key });
                return;
            }

            clearPendingTap();
            pendingTap = {
                key,
                timer: setTimeout(() => {
                    pendingTap = null;
                    if (state.mode === 'paint') paintTile(key);
                }, DOUBLE_TAP_MS)
            };
        }

        function removeTile(key, existing) {
            if (!state.isAdmin || existing?.removed) return;
            state.gridData[key] = { removed: true, author: state.username };
            requestDraw();
            socket?.emit('edit-tiles', { keys: [key], action: 'remove' });
        }

        function restoreTile(key, existing) {
            if (!state.isAdmin || !existing?.removed) return;
            delete state.gridData[key];
            requestDraw();
            socket?.emit('edit-tiles', { keys: [key], action: 'restore' });
        }

        // Toucher : ajoute la flèche ou la retire. Glisser : ajoute seulement.
        function toggleArrow(key, existing, isDrag) {
            if (!state.isAdmin || existing?.removed) return;
            const hasArrow = Number.isInteger(existing?.arrow);
            if (hasArrow && isDrag) return;
            socket?.emit('edit-tiles', { keys: [key], action: hasArrow ? 'arrow-remove' : 'arrow-add' });
        }

        function useToolAt(clientX, clientY, isDrag) {
            if (state.isLocked || state.mode === 'move' || state.mode === 'select') return;

            const key = tileKeyAt(clientX, clientY);
            if (!key) return;
            const existing = state.gridData[key];

            if (state.mode === 'erase') return removeTile(key, existing);
            if (state.mode === 'restore') return restoreTile(key, existing);
            if (state.mode === 'arrow') return toggleArrow(key, existing, isDrag);
            paintTile(key);
        }

        $('btnConfirmOverride').addEventListener('click', () => {
            if (pendingTileKey && !state.isLocked) applyPaint(pendingTileKey);
            pendingTileKey = null;
            el.overrideModal.hidden = true;
        });

        $('btnCancelOverride').addEventListener('click', () => {
            pendingTileKey = null;
            el.overrideModal.hidden = true;
        });

        /* ---------- Sélection par rectangle (admin) ---------- */

        function selectTilesInRect(rect) {
            const left = Math.min(rect.x1, rect.x2);
            const right = Math.max(rect.x1, rect.x2);
            const top = Math.min(rect.y1, rect.y2);
            const bottom = Math.max(rect.y1, rect.y2);
            const cos = Math.cos(view.rotation);
            const sin = Math.sin(view.rotation);
            const { minCol, maxCol, minRow, maxRow } = visibleRange();
            const keys = new Set();

            for (let row = minRow; row <= maxRow; row++) {
                for (let col = minCol; col <= maxCol; col++) {
                    const { x, y } = hexCenter(col, row);
                    const sx = view.panX + (x * cos - y * sin) * view.scale;
                    const sy = view.panY + (x * sin + y * cos) * view.scale;
                    if (sx >= left && sx <= right && sy >= top && sy <= bottom) keys.add(`${col},${row}`);
                }
            }
            return keys;
        }

        function finishSelection() {
            const rect = dragRect;
            dragRect = null;

            const tiny = Math.abs(rect.x2 - rect.x1) < 8 && Math.abs(rect.y2 - rect.y1) < 8;
            if (tiny) {
                // Simple toucher : sélectionne uniquement la case touchée.
                const world = screenToWorld(rect.x2, rect.y2);
                const hex = hexAtWorld(world.x, world.y);
                state.selection = hex ? new Set([`${hex.col},${hex.row}`]) : new Set();
            } else {
                state.selection = selectTilesInRect(rect);
            }
            updateSelectionBar();
            requestDraw();
        }

        /* ============================================================ */
        /* Gestes (souris et tactile via Pointer Events)                 */
        /* ============================================================ */

        const pointers = new Map(); // pointerId -> { x, y }
        let gesture = null;

        function endGestures() {
            pointers.clear();
            gesture = null;
            dragRect = null;
        }

        function beginGesture() {
            const previous = gesture;
            const active = [...pointers.values()];

            if (active.length === 1) {
                const [p] = active;
                const panOnly = previous?.type === 'pinch';
                gesture = {
                    type: 'single',
                    startX: p.x - view.panX,
                    startY: p.y - view.panY,
                    // Après un pincement, le doigt restant déplace la carte au lieu de peindre.
                    panOnly,
                    select: state.mode === 'select' && !panOnly
                };
            } else if (active.length === 2) {
                const [a, b] = active;
                const rect = el.canvas.getBoundingClientRect();
                dragRect = null;
                gesture = {
                    type: 'pinch',
                    distance: Math.hypot(b.x - a.x, b.y - a.y) || 1,
                    scale: view.scale,
                    anchor: screenToWorld((a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top)
                };
                requestDraw();
            } else {
                gesture = null;
            }
        }

        function toCanvas(e) {
            const rect = el.canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        el.canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            el.canvas.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            beginGesture();
            if (gesture?.type !== 'single') return;

            if (gesture.select) {
                const p = toCanvas(e);
                dragRect = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
            } else if (state.mode === 'paint') {
                handlePaintDown(e.clientX, e.clientY);
            } else {
                useToolAt(e.clientX, e.clientY, false);
            }
        });

        el.canvas.addEventListener('pointermove', (e) => {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (!gesture) return;

            if (gesture.type === 'single') {
                if (gesture.select) {
                    if (dragRect) {
                        const p = toCanvas(e);
                        dragRect.x2 = p.x;
                        dragRect.y2 = p.y;
                        requestDraw();
                    }
                } else if (state.mode !== 'move' && !state.isLocked && !gesture.panOnly) {
                    useToolAt(e.clientX, e.clientY, true);
                } else {
                    view.panX = e.clientX - gesture.startX;
                    view.panY = e.clientY - gesture.startY;
                    requestDraw();
                }
                return;
            }

            // Pincement : zoom et déplacement à deux doigts (sans rotation), ancrés sur le point de départ.
            const [a, b] = [...pointers.values()];
            const rect = el.canvas.getBoundingClientRect();
            const distance = Math.hypot(b.x - a.x, b.y - a.y) || 1;

            view.scale = clamp(gesture.scale * (distance / gesture.distance), MIN_SCALE, MAX_SCALE);

            const cos = Math.cos(view.rotation);
            const sin = Math.sin(view.rotation);
            const cx = (a.x + b.x) / 2 - rect.left;
            const cy = (a.y + b.y) / 2 - rect.top;
            view.panX = cx - (gesture.anchor.x * cos - gesture.anchor.y * sin) * view.scale;
            view.panY = cy - (gesture.anchor.x * sin + gesture.anchor.y * cos) * view.scale;
            requestDraw();
        });

        function releasePointer(e, cancelled) {
            if (!pointers.delete(e.pointerId)) return;
            if (el.canvas.hasPointerCapture(e.pointerId)) el.canvas.releasePointerCapture(e.pointerId);

            if (gesture?.type === 'single' && gesture.select && dragRect) {
                if (cancelled) {
                    dragRect = null;
                    requestDraw();
                } else {
                    finishSelection();
                }
            }
            beginGesture();
        }
        el.canvas.addEventListener('pointerup', (e) => releasePointer(e, false));
        el.canvas.addEventListener('pointercancel', (e) => releasePointer(e, true));

        el.canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = el.canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const newScale = clamp(view.scale * (e.deltaY < 0 ? 1.1 : 0.9), MIN_SCALE, MAX_SCALE);
            const ratio = newScale / view.scale;
            view.panX = mouseX - (mouseX - view.panX) * ratio;
            view.panY = mouseY - (mouseY - view.panY) * ratio;
            view.scale = newScale;
            requestDraw();
        }, { passive: false });

        /* ============================================================ */
        /* Événements serveur                                            */
        /* ============================================================ */

        if (socket) {
            socket.on('connect', () => {
                // À chaque (re)connexion, on reprend la session enregistrée : plus besoin de se reconnecter à la main.
                const saved = loadSession();
                if (saved) authenticate({ token: saved.token }, Boolean(state.username));
            });

            socket.on('init', (data) => {
                const sizeChanged = data.config && (data.config.cols !== state.cols || data.config.rows !== state.rows);

                state.gridData = data.gridData || {};
                state.cols = data.config?.cols ?? 10;
                state.rows = data.config?.rows ?? 8;
                state.isLocked = Boolean(data.isLocked);
                state.terrains = data.terrains || [];
                updateUsers(data.users || []);

                updateLockUI();
                renderTerrains();

                if (isMapActive()) {
                    if (sizeChanged) centerMap();
                    else requestDraw();
                }
            });

            socket.on('update-users-list', updateUsers);

            socket.on('update-terrains', (terrains) => {
                // Les joueurs gardent la même couleur sélectionnée (même position dans la légende) si l'admin la modifie.
                const activeIndex = state.terrains.findIndex((t) => t.color === state.activeColor);
                state.terrains = terrains;
                if (activeIndex >= 0 && terrains[activeIndex]) state.activeColor = terrains[activeIndex].color;
                renderTerrains();
                requestDraw();
            });

            socket.on('update-lock', (locked) => {
                state.isLocked = Boolean(locked);
                updateLockUI();
            });

            // Modifications de cases : { clé: case } ; null signifie que la case revient à l'état vierge.
            socket.on('update-tiles', ({ changes }) => {
                for (const [key, tile] of Object.entries(changes || {})) {
                    if (tile) state.gridData[key] = tile;
                    else delete state.gridData[key];
                }
                requestDraw();
            });

            socket.on('update-config', ({ config, gridData }) => {
                state.cols = config.cols;
                state.rows = config.rows;
                state.gridData = gridData || {};
                state.selection.clear();
                updateSelectionBar();
                if (isMapActive()) centerMap();
            });

            socket.on('maps-list', (maps) => {
                state.maps = maps;
                renderMaps();
            });

            socket.on('kicked', (message) => {
                clearSession();
                state.username = '';
                state.isAdmin = false;
                leaveFullscreen();
                applyRole();
                showLoginError(message);
                showPage('login');
            });
        }

        /* ============================================================ */
        /* Démarrage                                                     */
        /* ============================================================ */

        applyRole();
        renderMaps();
        if (!socket) showLoginError('Impossible de joindre le serveur.');
        else if (loadSession()) showLoginError('Reconnexion en cours…', false);
    })();
    </script>
</body>
</html>
