<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateau de Jeu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #e9ecef; display: flex; justify-content: center; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title { font-size: 1.2rem; font-weight: bold; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; background: #2c3e50; color: white; cursor: pointer; font-weight: bold; }
        .btn-green { background: #2ecc71; width: 100%; padding: 12px; font-size: 1.1rem; margin-top: 15px; }
        .section-title { font-size: 0.85rem; color: #7f8c8d; font-weight: bold; margin: 15px 0 8px 0; text-transform: uppercase; }
        .user-box { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem; color: #2d3748; }
        .terrain-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .color-picker { width: 35px; height: 35px; border: none; border-radius: 4px; cursor: pointer; }
        .terrain-input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        .admin-section { background: #fff3cd; padding: 10px; border-radius: 6px; border: 1px solid #ffeeba; margin-top: 15px; }
        .admin-section button { margin-top: 5px; width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="title" id="user-display">Joueur : ...</div>
        <button class="btn" id="btn-config" style="display:none;">⚙️ Régler plateau</button>
    </div>

    <div class="section-title">Joueurs en ligne</div>
    <div class="user-box" id="users-list">• Aucun</div>

    <div class="section-title">Couleurs & Légendes</div>
    <div id="terrains-container"></div>

    <!-- Outils réservés à l'Administrateur -->
    <div id="admin-map-tools" class="admin-section" style="display: none;">
        <div class="section-title" style="margin-top:0; color:#856404;">Gestion Carte (Admin)</div>
        <button id="btn-new-map" class="btn">🆕 Nouvelle carte</button>
        <button id="btn-export-map" class="btn">📥 Sauvegarder dans le téléphone</button>
        <button id="btn-import-trigger" class="btn">📤 Charger depuis le téléphone</button>
        <input type="file" id="file-input-map" accept=".json" style="display: none;">
    </div>

    <button class="btn btn-green" id="btn-go">🚀 GO !</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentConfig = { cols: 150, rows: 100 };
    let currentGridData = {};
    let currentTerrains = [];
    let myUsername = '';

    // Demander le pseudo
    function initUser() {
        myUsername = localStorage.getItem('username') || prompt("Entrez votre pseudo :") || "Anonyme";
        socket.emit('set-username', myUsername, (res) => {
            if (res && !res.success) {
                alert(res.message);
                localStorage.removeItem('username');
                initUser();
            } else {
                localStorage.setItem('username', myUsername);
                document.getElementById('user-display').innerText = `Joueur : ${myUsername}`;
                checkAdminRights();
            }
        });
    }

    function checkAdminRights() {
        const isAdmin = myUsername.toLowerCase() === 'admin';
        document.getElementById('admin-map-tools').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('btn-config').style.display = isAdmin ? 'block' : 'none';
    }

    socket.on('init', (data) => {
        currentConfig = data.config;
        currentGridData = data.gridData;
        currentTerrains = data.terrains;
        renderUsers(data.users);
        renderTerrains(data.terrains);
        initUser();
    });

    socket.on('update-users-list', (users) => renderUsers(users));
    socket.on('update-terrains', (terrains) => {
        currentTerrains = terrains;
        renderTerrains(terrains);
    });
    socket.on('update-config', (data) => {
        currentConfig = data.config;
        currentGridData = data.gridData;
    });

    function renderUsers(users) {
        const container = document.getElementById('users-list');
        container.innerHTML = users.map(u => `• ${u}`).join('<br>') || '• Aucun';
    }

    function renderTerrains(terrains) {
        const container = document.getElementById('terrains-container');
        container.innerHTML = '';
        terrains.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'terrain-row';
            div.innerHTML = `
                <input type="color" class="color-picker" value="${t.color}" disabled>
                <input type="text" class="terrain-input" value="${t.label}" readonly>
            `;
            container.appendChild(div);
        });
    }

    // --- ACTIONS ADMIN : EXPORT / IMPORT / RESET ---

    // 1. Nouvelle Carte
    document.getElementById('btn-new-map').addEventListener('click', () => {
        if (confirm("Créer une nouvelle carte vierge ?")) {
            socket.emit('reset-map');
        }
    });

    // 2. Exporter la carte au format JSON
    document.getElementById('btn-export-map').addEventListener('click', () => {
        const mapData = {
            config: currentConfig,
            gridData: currentGridData,
            terrainsList: currentTerrains
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapData, null, 2));
        const downloadAnchor = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `carte_${dateStr}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    // 3. Importer une carte depuis le téléphone
    document.getElementById('btn-import-trigger').addEventListener('click', () => {
        document.getElementById('file-input-map').click();
    });

    document.getElementById('file-input-map').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedData = JSON.parse(event.target.result);
                if (confirm("Remplacer le plateau actuel par le fichier sélectionné ?")) {
                    socket.emit('load-map-file', importedData);
                }
            } catch (err) {
                alert("Erreur lors de la lecture du fichier JSON.");
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });
</script>

</body>
</html>
