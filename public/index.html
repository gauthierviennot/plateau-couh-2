<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plateau Hexagonal Collaboratif</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: #f0f2f5; color: #333; }

        .page { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .page.active { display: flex; }

        /* --- PAGE 1 : CONNEXION --- */
        #page1 { background: #2c3e50; justify-content: center; align-items: center; }
        .login-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 90%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .login-card h1 { font-size: 1.4rem; color: #2c3e50; }
        .login-card input { padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; text-align: center; width: 100%; }
        .login-card button { padding: 12px; border: none; border-radius: 6px; background: #3498db; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }

        /* --- PAGE 2 : SALON / DASHBOARD --- */
        #page2 { background: #e5e9f0; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .dashboard-card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; gap: 12px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3498db; padding-bottom: 8px; flex-shrink: 0; }
        .dashboard-header h2 { font-size: 1.2rem; color: #2c3e50; }
        
        .section-title { font-weight: bold; font-size: 0.85rem; color: #7f8c8d; text-transform: uppercase; margin-top: 5px; flex-shrink: 0; }
        
        .user-list { background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; max-height: 100px; overflow-y: auto; font-size: 0.85rem; flex-shrink: 0; touch-action: pan-y; }
        .user-item { padding: 3px 0; display: flex; align-items: center; gap: 6px; color: #2c3e50; font-weight: 500; }
        .user-item::before { content: "•"; color: #2ecc71; font-weight: bold; }

        .terrain-palette { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 4px; min-height: 150px; touch-action: pan-y; }
        .terrain-item { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 6px; border: 1px solid #ddd; border-radius: 6px; flex-shrink: 0; }
        .terrain-color-preview { width: 28px; height: 28px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        .terrain-color-input { width: 32px; height: 32px; border: none; cursor: pointer; background: none; flex-shrink: 0; }
        .terrain-label-text { font-size: 0.9rem; font-weight: 600; color: #34495e; }
        .terrain-label-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }

        .btn-go { padding: 14px; border: none; border-radius: 8px; background: #2ecc71; color: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); flex-shrink: 0; }
        .btn-go:hover { background: #27ae60; }
        .btn-config { padding: 8px; border: none; border-radius: 6px; background: #34495e; color: white; font-weight: bold; font-size: 0.85rem; cursor: pointer; }

        /* --- PAGE 3 : CARTE EN PLEIN ÉCRAN --- */
        #page3 { background: #2c3e50; position: relative; overflow: hidden; display: none; width: 100vw; height: 100vh; touch-action: none; }
        
        .btn-exit { position: absolute; top: 15px; left: 15px; z-index: 50; width: 42px; height: 42px; background: #e74c3c; color: white; border: none; border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
        .btn-exit:hover { background: #c0392b; }

        /* Mini Liste Joueurs sur Page 3 */
        .mini-user-list { position: absolute; top: 65px; left: 15px; z-index: 50; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); padding: 6px 10px; border-radius: 6px; color: #ffffff; font-size: 0.7rem; max-width: 140px; max-height: 90px; overflow-y: auto; pointer-events: none; }
        .mini-user-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .mini-user-item::before { content: "•"; color: #2ecc71; }

        .fullscreen-palette { position: absolute; top: 165px; left: 15px; z-index: 50; display: flex; flex-direction: column; gap: 8px; background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 12px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 55vh; overflow-y: auto; touch-action: pan-y; }
        
        .hex-option { width: 34px; height: 34px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); cursor: pointer; border: none; flex-shrink: 0; transition: transform 0.2s, filter 0.2s; }
        .hex-option:hover { transform: scale(1.15); }
        .hex-option.selected { transform: scale(1.25); filter: drop-shadow(0px 0px 5px #000); }

        .mode-toggle-container { position: absolute; top: 15px; right: 15px; z-index: 50; display: flex; gap: 8px; }
        .btn-mode { padding: 10px 16px; border: none; border-radius: 20px; font-weight: bold; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-mode.paint { background-color: #2ecc71; color: white; }
        .btn-mode.move { background-color: #3498db; color: white; }
        .btn-reset-view { padding: 10px; border: none; border-radius: 50%; background: #ffffff; color: #333; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ecf0f1; display: block; touch-action: none; }

        /* Modales */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.hidden { display: none; }
        .modal-content { background: #ffffff; padding: 20px; border-radius: 8px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.8rem; font-weight: 600; }
        .control-group input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-danger { background-color: #e74c3c; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
        .btn-secondary { background-color: #95a5a6; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ==================== PAGE 1 : CONNEXION ==================== -->
    <div id="page1" class="page active">
        <div class="login-card">
            <h1>Plateau Hexagonal</h1>
            <input type="text" id="usernameInput" placeholder="Entrez votre pseudo" maxlength="15" autofocus>
            <button id="btnLogin">Rejoindre</button>
        </div>
    </div>

    <!-- ==================== PAGE 2 : SALON / DASHBOARD ==================== -->
    <div id="page2" class="page">
        <div class="dashboard-card">
            <div class="dashboard-header">
                <h2 id="welcomeUser">Bienvenue !</h2>
                <button class="btn-config" id="btnAdminConfig" style="display: none;">⚙️ Régler plateau</button>
            </div>

            <div class="section-title">Joueurs en ligne</div>
            <div id="onlineUsers" class="user-list"></div>

            <div class="section-title">Couleurs & Légendes</div>
            <div class="terrain-palette" id="terrainContainer"></div>

            <button class="btn-go" id="btnGo">🚀 GO !</button>
        </div>

        <div id="configModal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>Taille du Plateau</h3>
                <div class="control-group">
                    <label>Colonnes (largeur)</label>
                    <input type="number" id="cols" value="10" min="2" max="50">
                </div>
                <div class="control-group">
                    <label>Lignes (longueur)</label>
                    <input type="number" id="rows" value="8" min="2" max="50">
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" id="btnCloseModal">Annuler</button>
                    <button class="btn-danger" id="btnApplyConfig">Appliquer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== PAGE 3 : PLEIN ÉCRAN / CARTE ==================== -->
    <div id="page3" class="page">
        <button id="btnExitMap" class="btn-exit" title="Quitter la carte">✖</button>
        
        <!-- Liste Joueurs Coin Page 3 -->
        <div id="miniOnlineUsers" class="mini-user-list"></div>

        <div class="fullscreen-palette" id="fsPalette"></div>

        <div class="mode-toggle-container">
            <button id="btnResetView" class="btn-reset-view" title="Centrer la carte">🎯</button>
            <button id="btnModeToggle" class="btn-mode paint">Mode : Peindre 🎨</button>
        </div>

        <canvas id="hexCanvas"></canvas>

        <div id="overrideModal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>Remplacer la case ?</h3>
                <p id="overrideMessage" style="font-size: 0.85rem; color: #2c3e50;"></p>
                <div class="modal-actions">
                    <button class="btn-secondary" id="btnCancelOverride">Annuler</button>
                    <button class="btn-danger" id="btnConfirmOverride">Confirmer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = (typeof io !== 'undefined') ? io() : null;
        
        let myUsername = "Anonyme";
        let isAdmin = false;
        let activeColor = "#2ecc71";
        let pendingTileKey = null;

        let localUsersList = [];

        // Transformations Canvas
        let scale = 1.0, panX = 0, panY = 0, rotationAngle = 0;
        let cols = 10, rows = 8, hexRadius = 35;
        let gridData = {};

        let isPaintMode = true;
        let isMouseDown = false;
        let startX = 0, startY = 0;

        // Multi-touch
        let initialPinchDistance = null;
        let initialPinchAngle = 0;
        let initialScale = 1.0;
        let initialRotation = 0;
        let pinchCenter = { x: 0, y: 0 };
        let initialPanX = 0, initialPanY = 0;

        let terrains = [
            { color: '#2ecc71', label: 'Plaine' },
            { color: '#27ae60', label: 'Forêt' },
            { color: '#3498db', label: 'Eau' },
            { color: '#f1c40f', label: 'Désert' },
            { color: '#95a5a6', label: 'Montagne' },
            { color: '#ffffff', label: 'Gomme' },
            { color: '#e74c3c', label: 'Lave' },
            { color: '#8e44ad', label: 'Marais' },
            { color: '#e67e22', label: 'Canyon' },
            { color: '#16a085', label: 'Jungle' },
            { color: '#34495e', label: 'Rocher' },
            { color: '#d35400', label: 'Terre' }
        ];

        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');

        const usernameInput = document.getElementById('usernameInput');
        const btnLogin = document.getElementById('btnLogin');
        const welcomeUser = document.getElementById('welcomeUser');
        const onlineUsers = document.getElementById('onlineUsers');
        const miniOnlineUsers = document.getElementById('miniOnlineUsers');
        const btnAdminConfig = document.getElementById('btnAdminConfig');
        const terrainContainer = document.getElementById('terrainContainer');

        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');
        const fsPalette = document.getElementById('fsPalette');
        const btnModeToggle = document.getElementById('btnModeToggle');
        const btnResetView = document.getElementById('btnResetView');

        function showPage(page) {
            page1.classList.remove('active');
            page2.classList.remove('active');
            page3.classList.remove('active');
            
            page1.style.display = 'none';
            page2.style.display = 'none';
            page3.style.display = 'none';

            page.classList.add('active');
            page.style.display = 'flex';
        }

        // --- GESTION JOUEURS EN LIGNE ---
        function updateUsersUI(usersList) {
            if (Array.isArray(usersList) && usersList.length > 0) {
                localUsersList = usersList;
            } else if (!localUsersList.includes(myUsername)) {
                localUsersList.push(myUsername);
            }

            onlineUsers.innerHTML = '';
            miniOnlineUsers.innerHTML = '';

            localUsersList.forEach(u => {
                // Page 2
                const item = document.createElement('div');
                item.className = 'user-item';
                item.textContent = u;
                onlineUsers.appendChild(item);

                // Page 3 (Mini)
                const miniItem = document.createElement('div');
                miniItem.className = 'mini-user-item';
                miniItem.textContent = u;
                miniOnlineUsers.appendChild(miniItem);
            });
        }

        function handleLogin() {
            const val = usernameInput.value.trim();
            if (val.length > 0) {
                myUsername = val;
                isAdmin = myUsername.toLowerCase() === 'admin';
                welcomeUser.textContent = `Joueur : ${myUsername}`;
                
                btnAdminConfig.style.display = isAdmin ? 'block' : 'none';

                if (socket) {
                    socket.emit('set-username', myUsername);
                    socket.emit('get-users');
                }
                updateUsersUI([myUsername]);
                renderTerrains();
                showPage(page2);
            }
        }

        btnLogin.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

        // --- PALETTES ---
        function renderTerrains() {
            terrainContainer.innerHTML = '';
            fsPalette.innerHTML = '';

            terrains.forEach((t, idx) => {
                const item = document.createElement('div');
                item.className = 'terrain-item';

                if (isAdmin) {
                    const colorInput = document.createElement('input');
                    colorInput.type = 'color';
                    colorInput.className = 'terrain-color-input';
                    colorInput.value = t.color;
                    colorInput.addEventListener('change', (e) => {
                        terrains[idx].color = e.target.value;
                        if (socket) socket.emit('update-terrains', terrains);
                    });

                    const labelInput = document.createElement('input');
                    labelInput.type = 'text';
                    labelInput.className = 'terrain-label-input';
                    labelInput.value = t.label;
                    labelInput.addEventListener('change', (e) => {
                        terrains[idx].label = e.target.value;
                        if (socket) socket.emit('update-terrains', terrains);
                    });

                    item.appendChild(colorInput);
                    item.appendChild(labelInput);
                } else {
                    const preview = document.createElement('div');
                    preview.className = 'terrain-color-preview';
                    preview.style.backgroundColor = t.color;

                    const labelText = document.createElement('span');
                    labelText.className = 'terrain-label-text';
                    labelText.textContent = t.label;

                    item.appendChild(preview);
                    item.appendChild(labelText);
                }

                terrainContainer.appendChild(item);

                const hexBtn = document.createElement('button');
                hexBtn.className = 'hex-option' + (t.color === activeColor ? ' selected' : '');
                hexBtn.style.backgroundColor = t.color;
                hexBtn.onclick = () => {
                    activeColor = t.color;
                    renderTerrains();
                };
                fsPalette.appendChild(hexBtn);
            });
        }

        document.getElementById('btnGo').addEventListener('click', () => {
            showPage(page3);
            initCanvas();
            centerMap();
            
            if (page3.requestFullscreen) {
                page3.requestFullscreen().catch(() => {});
            }
        });

        const resizeObserver = new ResizeObserver(() => {
            if (page3.classList.contains('active')) {
                initCanvas();
            }
        });
        resizeObserver.observe(page3);

        document.getElementById('btnExitMap').addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            showPage(page2);
        });

        // --- ÉVÉNEMENTS SOCKET.IO ---
        if (socket) {
            socket.on('update-users-list', updateUsersUI);
            socket.on('users-list', updateUsersUI);

            socket.on('update-terrains', (newTerrains) => {
                terrains = newTerrains;
                renderTerrains();
            });

            socket.on('init', (data) => {
                gridData = data.gridData || {};
                cols = data.config ? data.config.cols : 10;
                rows = data.config ? data.config.rows : 8;
                if (data.terrains) terrains = data.terrains;
                if (data.users) updateUsersUI(data.users);
                document.getElementById('cols').value = cols;
                document.getElementById('rows').value = rows;
                renderTerrains();
                if (page3.classList.contains('active')) {
                    initCanvas();
                    centerMap();
                }
            });

            socket.on('update-tile', (data) => {
                gridData[data.key] = { color: data.color, author: data.author };
                if (page3.classList.contains('active')) drawGrid();
            });

            socket.on('update-config', (data) => {
                cols = data.config.cols;
                rows = data.config.rows;
                gridData = data.gridData || {};
                document.getElementById('cols').value = cols;
                document.getElementById('rows').value = rows;
                if (page3.classList.contains('active')) {
                    initCanvas();
                    centerMap();
                }
            });
        }

        // --- CALCULS DU PLATEAU ET CENTRAGE DYNAMIQUE ---
        function setMode(paintMode) {
            isPaintMode = paintMode;
            btnModeToggle.textContent = isPaintMode ? "Mode : Peindre 🎨" : "Mode : Déplacer ✋";
            btnModeToggle.className = isPaintMode ? "btn-mode paint" : "btn-mode move";
        }

        btnModeToggle.addEventListener('click', () => setMode(!isPaintMode));

        function getHexRawCenter(col, row) {
            const hexWidth = Math.sqrt(3) * hexRadius;
            const xOffset = (row % 2 === 1) ? hexWidth / 2 : 0;
            return {
                x: hexWidth / 2 + col * hexWidth + xOffset,
                y: hexRadius + row * (hexRadius * 1.5)
            };
        }

        // Fonction de centrage parfait quelles que soient les dimensions
        function centerMap() {
            scale = 1.0;
            rotationAngle = 0;

            const hexWidth = Math.sqrt(3) * hexRadius;
            const gridWidth = cols * hexWidth + (rows > 1 ? hexWidth / 2 : 0);
            const gridHeight = hexRadius * 2 + (rows - 1) * (hexRadius * 1.5);

            const screenWidth = canvas.width || window.innerWidth;
            const screenHeight = canvas.height || window.innerHeight;

            panX = (screenWidth - gridWidth) / 2;
            panY = (screenHeight - gridHeight) / 2;

            drawGrid();
        }

        btnResetView.addEventListener('click', centerMap);

        function initCanvas() {
            const rect = page3.getBoundingClientRect();
            canvas.width = rect.width || window.innerWidth;
            canvas.height = rect.height || window.innerHeight;
            drawGrid();
        }

        function drawHexagon(x, y, radius, fillColor) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const pointX = x + radius * Math.cos(angle);
                const pointY = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(pointX, pointY);
                else ctx.lineTo(pointX, pointY);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor || '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawGrid() {
            if (!ctx) return;
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ecf0f1";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(panX, panY);
            ctx.rotate(rotationAngle);
            ctx.scale(scale, scale);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const { x, y } = getHexRawCenter(c, r);
                    const key = `${c},${r}`;
                    const tile = gridData[key];
                    const color = tile ? tile.color : '#ffffff';
                    drawHexagon(x, y, hexRadius, color);
                }
            }
            ctx.restore();
        }

        function getCanvasCoordinates(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            let screenX = clientX - rect.left - panX;
            let screenY = clientY - rect.top - panY;

            const cos = Math.cos(-rotationAngle);
            const sin = Math.sin(-rotationAngle);

            const rx = screenX * cos - screenY * sin;
            const ry = screenX * sin + screenY * cos;

            return {
                x: rx / scale,
                y: ry / scale
            };
        }

        function paintTile(clientX, clientY) {
            const coords = getCanvasCoordinates(clientX, clientY);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const { x, y } = getHexRawCenter(c, r);
                    if (Math.hypot(coords.x - x, coords.y - y) < hexRadius * 0.85) {
                        const key = `${c},${r}`;
                        const currentColor = activeColor;
                        const existingTile = gridData[key];

                        if (existingTile && existingTile.author && existingTile.author !== myUsername && existingTile.color !== currentColor) {
                            isMouseDown = false;
                            pendingTileKey = key;
                            document.getElementById('overrideMessage').innerHTML = `L'utilisateur <strong>${existingTile.author}</strong> a déjà modifié cette case.<br>Voulez-vous la remplacer ?`;
                            document.getElementById('overrideModal').classList.remove('hidden');
                            return;
                        }

                        if (!existingTile || existingTile.color !== currentColor) {
                            gridData[key] = { color: currentColor, author: myUsername };
                            drawGrid();
                            if (socket) socket.emit('paint-tile', { key, color: currentColor });
                        }
                        return;
                    }
                }
            }
        }

        // Modales & Config
        document.getElementById('btnConfirmOverride').addEventListener('click', () => {
            if (pendingTileKey) {
                gridData[pendingTileKey] = { color: activeColor, author: myUsername };
                drawGrid();
                if (socket) socket.emit('paint-tile', { key: pendingTileKey, color: activeColor });
                pendingTileKey = null;
            }
            document.getElementById('overrideModal').classList.add('hidden');
        });

        document.getElementById('btnCancelOverride').addEventListener('click', () => {
            pendingTileKey = null;
            document.getElementById('overrideModal').classList.add('hidden');
        });

        btnAdminConfig.addEventListener('click', () => {
            document.getElementById('configModal').classList.remove('hidden');
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => {
            document.getElementById('configModal').classList.add('hidden');
        });

        document.getElementById('btnApplyConfig').addEventListener('click', () => {
            const newCols = parseInt(document.getElementById('cols').value);
            const newRows = parseInt(document.getElementById('rows').value);
            if (confirm("Changer la taille réinitialisera le plateau. Continuer ?")) {
                cols = newCols;
                rows = newRows;
                gridData = {};
                if (socket) socket.emit('change-config', { cols, rows });
                document.getElementById('configModal').classList.add('hidden');
                centerMap();
            }
        });

        // Souris
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            if (isPaintMode) paintTile(e.clientX, e.clientY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            if (isPaintMode) {
                paintTile(e.clientX, e.clientY);
            } else {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                drawGrid();
            }
        });

        window.addEventListener('mouseup', () => isMouseDown = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newScale = Math.min(Math.max(0.3, scale * zoomFactor), 5.0);

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            drawGrid();
        }, { passive: false });

        // Tactile (Zoom & Rotation centrés sur pincement)
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isMouseDown = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
                if (isPaintMode) paintTile(e.touches[0].clientX, e.touches[0].clientY);
            } else if (e.touches.length === 2) {
                isMouseDown = false;
                const t1 = e.touches[0];
                const t2 = e.touches[1];

                const rect = canvas.getBoundingClientRect();
                pinchCenter = {
                    x: (t1.clientX + t2.clientX) / 2 - rect.left,
                    y: (t1.clientY + t2.clientY) / 2 - rect.top
                };

                initialPinchDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                initialPinchAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);

                initialScale = scale;
                initialRotation = rotationAngle;
                initialPanX = panX;
                initialPanY = panY;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 1 && isMouseDown) {
                if (isPaintMode) {
                    paintTile(e.touches[0].clientX, e.touches[0].clientY);
                } else {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    drawGrid();
                }
            } else if (e.touches.length === 2 && initialPinchDistance) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];

                const currentDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                const currentAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);

                const angleDiff = currentAngle - initialPinchAngle;
                const newRotation = initialRotation + angleDiff;

                const factor = currentDistance / initialPinchDistance;
                const newScale = Math.min(Math.max(0.3, initialScale * factor), 5.0);

                const cosDiff = Math.cos(newRotation - initialRotation);
                const sinDiff = Math.sin(newRotation - initialRotation);

                const dx = initialPanX - pinchCenter.x;
                const dy = initialPanY - pinchCenter.y;

                const rotatedDx = dx * cosDiff - dy * sinDiff;
                const rotatedDy = dx * sinDiff + dy * cosDiff;

                scale = newScale;
                rotationAngle = newRotation;
                panX = pinchCenter.x + rotatedDx * (newScale / initialScale);
                panY = pinchCenter.y + rotatedDy * (newScale / initialScale);

                drawGrid();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if (e.touches.length === 0) {
                isMouseDown = false;
            }
        });
    </script>
</body>
</html>
